name: BB610 AI Sales IndexNow Submit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'products/**/index.html'
      - 'guides/**/index.html'
      - 'categories/**/index.html'
      - 'ops/indexnow-submit-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed AI Sales URLs to IndexNow
        env:
          INDEXNOW_EVENT: ${{ github.event_name }}
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
        run: python ops/indexnow_submit.py
      - name: Upload IndexNow report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-submission-${{ github.run_id }}
          path: docs/ai_sales/INDEXNOW_SUBMISSION_20260930.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit submission report
        if: always()
        run: |
          mode="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/ai_sales/INDEXNOW_SUBMISSION_20260930.json')
          if not p.is_file():
              print('')
          else:
              try:
                  print(json.loads(p.read_text(encoding='utf-8')).get('submission_mode',''))
              except Exception:
                  print('')
          PY
          )"
          if [ "$mode" = "changed_only" ]; then
            echo "Automatic changed-only submission report retained as workflow artifact; no repository commit."
            exit 0
          fi
          set -euo pipefail
          git add docs/ai_sales/INDEXNOW_SUBMISSION_20260930.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "bb610-ai-sales-bot"
          git config user.email "bb610-ai-sales-bot@users.noreply.github.com"
          git commit -m "Record IndexNow submission result"
          git push origin HEAD:main
