name: BB610 Category SEO Server

on:
  push:
    branches: [main]
    paths:
      - 'ops/category-seo-server-request.json'
      - '.github/workflows/bb610_category_seo_server.yml'

permissions:
  contents: read

concurrency:
  group: bb610-category-seo-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('ops/category-seo-server-request.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          action=str(d.get('action') or '').strip()
          if action not in {'audit','apply','verify'}:
              raise SystemExit('unsupported action: '+repr(action))
          print('action='+action)
          PY

      - name: Configure SSH
        shell: bash
        env:
          KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          test -n "$HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/bb610_vps
          chmod 600 ~/.ssh/bb610_vps
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Audit production nginx
        if: steps.req.outputs.action == 'audit'
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== nginx version ==='
          nginx -v 2>&1
          echo '=== matching server block ==='
          nginx -T 2>&1 | awk '
            /server[[:space:]]*\{/ {buf=$0"\n"; capture=1; depth=1; next}
            capture {
              buf=buf $0"\n"
              opens=gsub(/\{/,"{")
              closes=gsub(/\}/,"}")
              depth+=opens-closes
              if(depth<=0){
                if(buf ~ /server_name[[:space:]][^;]*market\.bb610\.com\.ua/) print buf
                capture=0; buf=""
              }
            }'
          echo '=== production files ==='
          ls -l /opt/bb610-market/catalog.html || true
          readlink -f /opt/bb610-market/catalog.html || true
          echo '=== current response ==='
          for u in             'https://market.bb610.com.ua/catalog.html'             'https://market.bb610.com.ua/catalog.html?category=nutrition'             'https://market.bb610.com.ua/catalog.html?category=biostimulation'
          do
            echo "--- $u"
            curl -fsS -D - "$u" -o /tmp/catalog.out | sed -n '1,20p'
            grep -Eio '<title>[^<]+</title>|<meta name="description"[^>]+>|<link rel="canonical"[^>]+>|<h1[^>]*>[^<]+</h1>' /tmp/catalog.out | head -n 10 || true
          done
          REMOTE

      - name: Apply category SEO nginx routing
        if: steps.req.outputs.action == 'apply'
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /opt/bb610-market/catalog-nutrition.html
          test -f /opt/bb610-market/catalog-biostimulation.html

          conf=''
          for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do
            [ -f "$f" ] || continue
            if grep -Eq 'server_name[[:space:]][^;]*market\.bb610\.com\.ua' "$f"; then
              conf="$f"
              break
            fi
          done
          test -n "$conf"
          cp -a "$conf" "$conf.bak-category-seo-20261001"

          python3 - "$conf" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1])
          s=p.read_text()
          marker='# BB610 CATEGORY SEO ADS LANDINGS'
          if marker in s:
              print('routing already present')
              raise SystemExit(0)
          # Insert into the HTTPS server block containing market.bb610.com.ua and /opt/bb610-market root.
          starts=[m.start() for m in re.finditer(r'(?m)^\s*server\s*\{',s)]
          chosen=None
          for start in starts:
              depth=0; end=None
              for i in range(start,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
              if end is None: continue
              block=s[start:end]
              if re.search(r'server_name\s+[^;]*market\.bb610\.com\.ua',block) and ('443' in block or 'ssl' in block):
                  chosen=(start,end,block); break
          if not chosen:
              raise SystemExit('HTTPS market server block not found')
          start,end,block=chosen
          insert=r'''
              # BB610 CATEGORY SEO ADS LANDINGS
              location = /catalog.html {
                  if ($arg_category = nutrition) {
                      rewrite ^ /catalog-nutrition.html break;
                  }
                  if ($arg_category = biostimulation) {
                      rewrite ^ /catalog-biostimulation.html break;
                  }
                  try_files /catalog.html =404;
              }
          '''
          pos=block.rfind('}')
          block=block[:pos]+insert+block[pos:]
          p.write_text(s[:start]+block+s[end:])
          PY

          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify category SEO
        if: steps.req.outputs.action == 'apply' || steps.req.outputs.action == 'verify'
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          cases={
            'https://market.bb610.com.ua/catalog.html':(
              'Каталог · BB610 Market',
              'https://market.bb610.com.ua/catalog.html',
              'Каталог',
            ),
            'https://market.bb610.com.ua/catalog.html?category=nutrition':(
              'Професійні добрива для рослин — BB610 Market',
              'https://market.bb610.com.ua/catalog.html?category=nutrition',
              'Професійні добрива для рослин',
            ),
            'https://market.bb610.com.ua/catalog.html?category=biostimulation':(
              'Біостимулятори для рослин — BB610 Market',
              'https://market.bb610.com.ua/catalog.html?category=biostimulation',
              'Біостимулятори для рослин',
            ),
          }
          for url,(title,canonical,h1) in cases.items():
              req=urllib.request.Request(url,headers={'User-Agent':'BB610-Category-SEO-Verify/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8','replace')
                  assert r.status==200,(url,r.status)
              assert f'<title>{title}</title>' in body,url
              assert f'<link rel="canonical" href="{canonical}">' in body,url
              assert re.search(r'<h1[^>]*>'+re.escape(h1)+r'</h1>',body),url
              print('PASS',url)
          PY
          REMOTE
