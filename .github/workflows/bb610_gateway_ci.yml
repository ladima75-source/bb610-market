name: BB610 VPS Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'ops/bb610-github-gateway-v3'
      - 'ops/export_v5_snapshot.py'
      - 'ops/gateway-upgrade.json'
      - 'ops/twofamily-rollout.py'
      - '.github/workflows/bb610_gateway_ci.yml'
  pull_request:
    paths:
      - 'ops/bb610-github-gateway-v3'
      - 'ops/export_v5_snapshot.py'
      - 'ops/gateway-upgrade.json'
      - '.github/workflows/bb610_gateway_ci.yml'

permissions:
  contents: read

jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate gateway shell syntax
        run: |
          set -euo pipefail
          bash -n ops/bb610-github-gateway-v3

      - name: Validate snapshot exporter syntax
        run: |
          set -euo pipefail
          python -m py_compile ops/export_v5_snapshot.py

      - name: Validate TwoFamily rollout syntax
        run: |
          set -euo pipefail
          python -m py_compile ops/twofamily-rollout.py

      - name: Validate hash-pinned gateway upgrade contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('ops/gateway-upgrade.json').read_text(encoding='utf-8'))
          assert d.get('target_path') == '/usr/local/sbin/bb610-github-gateway'
          assert d.get('target_repo_path') == 'ops/bb610-github-gateway-v3'
          expected=str(d.get('expected_current_sha256') or '')
          assert re.fullmatch(r'[0-9a-f]{64}', expected), 'expected_current_sha256 must be sha256'
          assert isinstance(d.get('enabled'), bool), 'enabled must be boolean'
          if d['enabled']:
              assert str(d.get('reason') or '').strip(), 'enabled upgrade requires reason'
          print('BB610 VPS GATEWAY: PASS')
          PY
