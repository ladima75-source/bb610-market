name: BB610 Gateway Probe

on:
  push:
    branches: [main]
    paths:
      - 'ops/gateway-probe-request.txt'
      - '.github/workflows/bb610_gateway_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/bb610_vps
          chmod 600 ~/.ssh/bb610_vps
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe installed gateway through read-only snapshot
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@"$HOST" snapshot > /tmp/bb610-probe.tar.gz
          mkdir -p /tmp/bb610-probe
          tar -xzf /tmp/bb610-probe.tar.gz -C /tmp/bb610-probe ./manifest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/bb610-probe/manifest.json',encoding='utf-8'))
          print(json.dumps({
              'git': d.get('git',{}),
              'gateway': d.get('gateway',{}),
              'gateway_upgrade': d.get('gateway_upgrade',{})
          },ensure_ascii=False,indent=2))
          PY

      - name: Verify live Merchant SeaSailer image
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, struct, urllib.request
          feed='https://api.market.bb610.com.ua/api/v1/catalog/feeds/google-merchant.csv'
          target='BB610-906E45D6FF4693'
          expected='https://market.bb610.com.ua/assets/img/v5/channel/seasailer-20kg.jpg'
          with urllib.request.urlopen(feed, timeout=30) as resp:
              text=resp.read().decode('utf-8-sig')
          rows=list(csv.DictReader(io.StringIO(text)))
          row=next((x for x in rows if x.get('id')==target), None)
          assert row, f'{target} missing from live Merchant feed'
          print('LIVE_FEED_ROW', {k:row.get(k) for k in ('id','title','image_link','price','availability')})
          assert row.get('image_link')==expected, (row.get('image_link'), expected)
          req=urllib.request.Request(expected, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              data=resp.read()
              ctype=resp.headers.get('content-type')
          assert data[:2] == b'\xff\xd8', f'not JPEG: {data[:16]!r}, content-type={ctype}'
          i=2
          w=h=None
          sof={0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while i+9 < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              while i < len(data) and data[i] == 0xFF:
                  i += 1
              marker=data[i]; i += 1
              if marker in (0xD8,0xD9):
                  continue
              if i+2 > len(data):
                  break
              seglen=struct.unpack('>H', data[i:i+2])[0]
              if marker in sof and i+7 <= len(data):
                  h=struct.unpack('>H', data[i+3:i+5])[0]
                  w=struct.unpack('>H', data[i+5:i+7])[0]
                  break
              i += seglen
          assert w and h, 'JPEG dimensions not found'
          print('IMAGE_CHECK', {'bytes':len(data),'width':w,'height':h,'content_type':ctype})
          assert w >= 250 and h >= 250, f'image still too small: {w}x{h}'
          assert (ctype or '').lower().startswith('image/jpeg'), f'unexpected content-type: {ctype}'
          PY
