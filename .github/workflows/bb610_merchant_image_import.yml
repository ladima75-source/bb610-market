name: BB610 Merchant Image Import

on:
  push:
    branches: [main]
    paths:
      - 'ops/merchant-image-import-request.txt'

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified SeaSailer 20kg image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/v5/channel
          url='https://godomall.speedycdn.net/d7edf57af8cba2f9de6fa9e1e88e0c40/goods/1000001036/image/detail/1000001036_detail_011.jpg'
          curl -fL --retry 3 -A 'Mozilla/5.0' "$url" -o assets/img/v5/channel/seasailer-20kg.jpg
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('assets/img/v5/channel/seasailer-20kg.jpg')
          data=p.read_bytes()
          assert data[:2] == b'\xff\xd8', 'source is not JPEG'
          i=2; w=h=None
          sof={0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while i+9 < len(data):
              if data[i] != 0xFF:
                  i += 1; continue
              while i < len(data) and data[i] == 0xFF: i += 1
              marker=data[i]; i += 1
              if marker in (0xD8,0xD9): continue
              seglen=struct.unpack('>H',data[i:i+2])[0]
              if marker in sof:
                  h=struct.unpack('>H',data[i+3:i+5])[0]
                  w=struct.unpack('>H',data[i+5:i+7])[0]
                  break
              i += seglen
          assert (w,h)==(500,500), (w,h)
          print('verified', len(data), w, h)

          code=Path('backend/services/product_master_feed_v5.py')
          text=code.read_text(encoding='utf-8')
          old='"BB610-906E45D6FF4693": "https://godomall.speedycdn.net/d7edf57af8cba2f9de6fa9e1e88e0c40/goods/1000001036/image/detail/1000001036_detail_011.jpg"'
          new='"BB610-906E45D6FF4693": "/assets/img/v5/channel/seasailer-20kg.jpg"'
          assert old in text, 'expected external override not found'
          code.write_text(text.replace(old,new),encoding='utf-8')
          PY

      - name: Commit local channel image
        shell: bash
        run: |
          set -euo pipefail
          git add assets/img/v5/channel/seasailer-20kg.jpg backend/services/product_master_feed_v5.py
          git diff --cached --check
          git config user.name 'bb610-merchant-bot'
          git config user.email 'bb610-merchant-bot@users.noreply.github.com'
          git commit -m 'Host SeaSailer 20kg Merchant image locally'
          git push origin HEAD:main
