name: BB610 Product Master V5 CI

on:
  push:
    branches: [main]
    paths:
      - 'v5/**'
      - 'backend/services/product_master_v5.py'
      - 'backend/product_master_v5_api.py'
      - 'backend/app.py'
      - '.github/workflows/bb610_v5_ci.yml'
  pull_request:
    paths:
      - 'v5/**'
      - 'backend/services/product_master_v5.py'
      - 'backend/product_master_v5_api.py'
      - 'backend/app.py'
      - '.github/workflows/bb610_v5_ci.yml'

permissions:
  contents: read

jobs:
  build-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Product Master V5 SQLite
        run: |
          set -euo pipefail
          python v5/bootstrap_db.py --out /tmp/bb610-v5.sqlite3

      - name: V5 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          con=sqlite3.connect('/tmp/bb610-v5.sqlite3')
          q=lambda sql: con.execute(sql).fetchone()[0]
          assert q('SELECT COUNT(*) FROM products') == 86
          assert q('SELECT COUNT(*) FROM skus') == 221
          assert q('SELECT COUNT(*) FROM sku_commerce') == 221
          assert q('SELECT COUNT(*) FROM sku_aliases') == 109
          assert q('SELECT COUNT(*) FROM product_sources') == 118
          assert q("SELECT COUNT(*) FROM migration_evidence WHERE entity_type='product' AND field_name='content' AND decision='accepted'") == 86
          assert q("SELECT COUNT(*) FROM sku_commerce WHERE availability='request_price'") == 17
          assert q("SELECT COUNT(*) FROM sku_commerce WHERE availability='legacy_disabled'") == 0
          assert q("SELECT COUNT(*) FROM media") == 279
          assert q("SELECT COUNT(*) FROM sku_media") == 177
          assert q("SELECT COUNT(DISTINCT sku_id) FROM sku_media WHERE binding_kind='exact'") == 177
          assert q("SELECT COUNT(*) FROM sku_media WHERE binding_kind!='exact'") == 0
          assert q("SELECT COUNT(*) FROM product_media") == 282
          assert q("SELECT COUNT(*) FROM products WHERE public_enabled=1 AND status='active'") == 82
          assert q("SELECT COUNT(*) FROM products WHERE public_enabled=0") == 4
          assert q("SELECT COUNT(*) FROM skus WHERE package_group='small'") > 0
          assert q("SELECT COUNT(*) FROM skus WHERE package_group='medium'") > 0
          assert q("SELECT COUNT(*) FROM skus WHERE package_group='large'") > 0
          assert not list(con.execute('PRAGMA foreign_key_check'))
          print('BB610 PRODUCT MASTER V5: PASS')
          PY

      - name: V5 shadow API service
        env:
          BB610_V5_DB_PATH: /tmp/bb610-v5.sqlite3
        run: |
          set -euo pipefail
          python - <<'PY'
          from backend.services.product_master_v5 import snapshot, product, resolve_sku_id
          data=snapshot()
          assert data['schema_version']=='5.0'
          assert data['counts']['products']==86
          assert data['counts']['skus']==221
          assert data['counts']['public_products']==82
          assert data['counts']['hidden_products']==4
          assert data['counts']['public_skus'] < data['counts']['skus']
          assert data['counts']['product_sources']==118
          assert data['counts']['media']==279
          assert data['counts']['product_media']==282
          assert data['counts']['exact_sku_media']==177
          kendal=product('kendal')
          assert kendal is not None and kendal['description'] and kendal['sources']
          assert product('switch-625-wg') is None
          hidden_switch=product('switch-625-wg', public_only=False)
          assert hidden_switch is not None and hidden_switch['public_enabled']==0
          assert product('plantlogic-25l-round-new-1308125') is None
          grouped=product('plantlogic-40-round-ugroove-1308041')
          assert grouped is not None and grouped['product_id']=='blueberry-round-u-groove-pots'
          assert all(m.get('binding_kind')=='exact' for s in grouped['skus'] for m in s.get('media',[]))
          assert grouped['media']
          assert product('plantlogic-40l-round-u-grooves-1308041')['product_id']=='blueberry-round-u-groove-pots'
          assert resolve_sku_id('BB610-VLG-KENDAL-100ML')=='BB610-32DA4F652F73A1'
          print('BB610 V5 SHADOW API SERVICE: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bb610-product-master-v5
          path: /tmp/bb610-v5.sqlite3
          if-no-files-found: error
          retention-days: 7
