name: BB610 Product Master V5 CI

on:
  push:
    branches: [main]
    paths:
      - 'v5/**'
      - 'backend/services/product_master_v5.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'backend/catalog_provider.py'
      - 'backend/services/product_commerce.py'
      - 'admin/products.js'
      - 'admin/products.html'
      - 'backend/product_master_v5_api.py'
      - 'admin/admin-master-nav.js'
      - 'admin/catalog.css'
      - 'admin/catalog.js'
      - 'admin/catalog.html'
      - 'backend/product_master_v5_admin_api.py'
      - 'backend/services/product_master_v5_admin.py'
      - 'backend/app.py'
      - '.github/workflows/bb610_v5_ci.yml'
  pull_request:
    paths:
      - 'v5/**'
      - 'backend/services/product_master_v5.py'
      - 'backend/catalog_provider.py'
      - 'backend/services/product_commerce.py'
      - 'admin/products.js'
      - 'admin/products.html'
      - 'backend/product_master_v5_api.py'
      - 'admin/admin-master-nav.js'
      - 'admin/catalog.css'
      - 'admin/catalog.js'
      - 'admin/catalog.html'
      - 'backend/product_master_v5_admin_api.py'
      - 'backend/services/product_master_v5_admin.py'
      - 'backend/app.py'
      - '.github/workflows/bb610_v5_ci.yml'

permissions:
  contents: read

jobs:
  build-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Product Master V5 SQLite
        run: |
          set -euo pipefail
          python v5/bootstrap_db.py --out /tmp/bb610-v5.sqlite3

      - name: V5 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          con=sqlite3.connect('/tmp/bb610-v5.sqlite3')
          q=lambda sql: con.execute(sql).fetchone()[0]
          assert q('SELECT COUNT(*) FROM products') == 86
          assert q('SELECT COUNT(*) FROM skus') == 221
          assert q('SELECT COUNT(*) FROM sku_commerce') == 221
          assert q('SELECT COUNT(*) FROM sku_aliases') == 109
          assert q('SELECT COUNT(*) FROM sku_alias_commerce') == 109
          assert q('SELECT COUNT(*) FROM product_sources') == 118
          assert q("SELECT COUNT(*) FROM migration_evidence WHERE entity_type='product' AND field_name='content' AND decision='accepted'") == 86
          assert q("SELECT COUNT(*) FROM sku_commerce WHERE availability='request_price'") == 17
          assert q("SELECT COUNT(*) FROM sku_commerce WHERE availability='legacy_disabled'") == 0
          assert q("SELECT COUNT(*) FROM media") == 279
          assert q("SELECT COUNT(*) FROM sku_media") == 177
          assert q("SELECT COUNT(DISTINCT sku_id) FROM sku_media WHERE binding_kind='exact'") == 177
          assert q("SELECT COUNT(*) FROM sku_media WHERE binding_kind!='exact'") == 0
          assert q("SELECT COUNT(*) FROM product_media") == 282
          assert q("SELECT COUNT(*) FROM products WHERE public_enabled=1 AND status='active'") == 82
          assert q("SELECT COUNT(*) FROM products WHERE public_enabled=0") == 4
          assert q("SELECT COUNT(*) FROM skus WHERE package_group='small'") > 0
          assert q("SELECT COUNT(*) FROM skus WHERE package_group='medium'") > 0
          assert q("SELECT COUNT(*) FROM skus WHERE package_group='large'") > 0
          assert not list(con.execute('PRAGMA foreign_key_check'))
          print('BB610 PRODUCT MASTER V5: PASS')
          PY

      - name: V5 shadow API service
        env:
          BB610_V5_DB_PATH: /tmp/bb610-v5.sqlite3
        run: |
          set -euo pipefail
          python - <<'PY'
          from backend.services.product_master_v5 import snapshot, product, resolve_sku, resolve_sku_id
          data=snapshot()
          assert data['schema_version']=='5.0'
          assert data['counts']['products']==86
          assert data['counts']['skus']==221
          assert data['counts']['public_products']==82
          assert data['counts']['hidden_products']==4
          assert data['counts']['public_skus'] < data['counts']['skus']
          assert data['counts']['product_sources']==123
          assert data['counts']['media']==307
          assert data['counts']['product_media']==282
          assert data['counts']['exact_sku_media']==208
          kendal=product('kendal')
          assert kendal is not None and kendal['description'] and kendal['sources']
          assert product('switch-625-wg') is None
          hidden_switch=product('switch-625-wg', public_only=False)
          assert hidden_switch is not None and hidden_switch['public_enabled']==0
          assert product('plantlogic-25l-round-new-1308125') is None
          grouped=product('plantlogic-40-round-ugroove-1308041')
          assert grouped is not None and grouped['product_id']=='blueberry-round-u-groove-pots'
          assert all(m.get('binding_kind')=='exact' for s in grouped['skus'] for m in s.get('media',[]))
          assert grouped['media']
          assert product('plantlogic-40l-round-u-grooves-1308041')['product_id']=='blueberry-round-u-groove-pots'
          assert resolve_sku_id('BB610-VLG-KENDAL-100ML')=='BB610-32DA4F652F73A1'
          legacy=resolve_sku('BB610-VLG-KENDAL-100ML')
          assert legacy['is_alias'] is True
          assert legacy['commerce_source']=='preserved_alias_snapshot'
          assert legacy['price']==215.0
          assert legacy['canonical_sku_id']=='BB610-32DA4F652F73A1'
          assert resolve_sku('BB610-32DA4F652F73A1')['price']==220.0
          fulvix=product('agriflex-fulvix-fulvokysloty-60')
          assert fulvix is not None
          assert fulvix['slug']=='agriflex-fulvix-fulvokysloty-50'
          assert '50%' in fulvix['name']
          assert '50%' in (fulvix['composition'] or '')
          for pid,sku_id in [
              ('blueberry-round-pots','PL-BB-1308025-BK'),
              ('blueberry-round-short-legs-pot','PL-BB-1303025-BK'),
              ('blueberry-round-u-groove-pots','PL-BB-13080350-BK'),
          ]:
              item=product(pid)
              sku=next(x for x in item['skus'] if x['sku_id']==sku_id)
              assert sku['media'], (pid,sku_id)
              assert sku['media'][0]['verification_status']=='verified'
          for pid,sku_id in [
              ('master-npk-15-5-30','BB610-VLG-MASTER15530-1KG'),
              ('master-npk-15-5-30','BB610-VLG-MASTER15530-250G'),
              ('plantafol-npk-0-25-50','BB610-VLG-PLANTAFOL02550-250G'),
              ('plantafol-npk-10-54-10','BB610-VLG-PLANTAFOL105410-250G'),
              ('plantafol-npk-30-10-10','BB610-VLG-PLANTAFOL301010-250G'),
              ('plantafol-npk-5-15-45','BB610-VLG-PLANTAFOL51545-250G'),
              ('megafol','BB610-VLG-MEGAFOL-1L'),
              ('megafol','BB610-VLG-MEGAFOL-10L'),
              ('kendal-root','BB610-VLG-KENDALROOT-10L'),
          ]:
              item=product(pid)
              sku=next(x for x in item['skus'] if x['sku_id']==sku_id)
              assert sku['media'], (pid,sku_id)
              assert sku['media'][0]['verification_status']=='verified'
              assert sku['media'][0]['source_kind']=='verified_package_product_page'
          amino=product('agriflex-amino-aminokysloty-50')
          amino20=next(x for x in amino['skus'] if x['sku_id']=='BB610-813432FDF29AE4')
          assert amino20['package_value']==20
          assert amino20['package_unit']=='kg'
          assert amino20['package_label']=='20 кг'
          for pid,sku_id in [
              ('agriflex-amino-aminokysloty-50','BB610-24D24A6B4EB211'),
              ('agriflex-amino-aminokysloty-50','BB610-E72D0A565A6415'),
              ('agriflex-amino-aminokysloty-50','BB610-813432FDF29AE4'),
              ('agriflex-aminovix','BB610-021E63CD9734F9'),
              ('agriflex-fulvix-fulvokysloty-60','BB610-EAEE397CF0D45E'),
              ('agriflex-zn','BB610-75B55F8DEAD7C2'),
              ('agriflex-zn','BB610-156A7D639ED836'),
              ('valagro-edta-5sg','BB610-3B882CCA6D419D'),
              ('valagro-edta-fe-13','BB610-74DDB26C8BB13D'),
          ]:
              item=product(pid)
              sku=next(x for x in item['skus'] if x['sku_id']==sku_id)
              assert sku['media'], (pid,sku_id)
              assert sku['media'][0]['verification_status']=='verified'
              assert sku['media'][0]['source_kind']=='verified_package_product_page'
          kendal25=product('kendal')
          kendal25sku=next(x for x in kendal25['skus'] if x['sku_id']=='BB610-VLG-KENDAL-25ML')
          assert kendal25sku['media']
          assert kendal25sku['media'][0]['verification_status']=='verified'
          assert kendal25sku['media'][0]['source_kind']=='verified_package_product_page'
          for pid in ('agriflex-bio','max-600-seasailer'):
              item=product(pid)
              assert item is not None
              assert all(x.get('source_type')!='unverified_legacy_name' for x in item['sources'])
          master134013=product('master-npk-13-40-13')
          assert master134013['name']=='MASTER 13-40-13 — водорозчинне NPK-добриво Valagro'
          assert 'P₂O₅' in (master134013['composition'] or '')
          assert '20–25 г на 10 л' in (master134013['application'] or '')
          assert len(master134013['benefits']) >= 3
          for pid,sku_id in [
              ('master-npk-13-40-13','BB610-VLG-MASTER134013-1KG'),
              ('master-npk-13-40-13','BB610-VLG-MASTER134013-250G'),
              ('master-npk-20-20-20','BB610-VLG-MASTER202020-1KG'),
              ('master-npk-20-20-20','BB610-VLG-MASTER202020-250G'),
              ('master-npk-3-11-38','BB610-VLG-MASTER31138-1KG'),
              ('master-npk-3-11-38','BB610-VLG-MASTER31138-250G'),
              ('plantafol-npk-20-20-20','BB610-VLG-PLANTAFOL202020-1KG'),
              ('plantafol-npk-20-20-20','BB610-VLG-PLANTAFOL202020-250G'),
              ('plantafol-npk-20-20-20','BB610-VLG-PLANTAFOL202020-5KG'),
          ]:
              item=product(pid)
              sku=next(x for x in item['skus'] if x['sku_id']==sku_id)
              assert sku['media'], (pid,sku_id)
              assert sku['media'][0]['verification_status']=='verified'
              assert sku['media'][0]['source_kind']=='verified_package_product_page'
          print('BB610 V5 SHADOW API SERVICE: PASS')
          PY

      - name: V5 live commerce + checkout resolver contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sqlite3, tempfile
          from pathlib import Path

          live=Path('/tmp/bb610-live-commerce.sqlite3')
          if live.exists():
              live.unlink()
          con=sqlite3.connect(live)
          con.execute('''
            CREATE TABLE sku_commerce(
              sku TEXT PRIMARY KEY,
              price REAL,
              sale_price REAL,
              availability TEXT,
              stock_qty REAL,
              enabled INTEGER NOT NULL,
              updated_at TEXT
            )
          ''')
          con.executemany(
              'INSERT INTO sku_commerce VALUES(?,?,?,?,?,?,?)',
              [
                  ('BB610-32DA4F652F73A1',333.0,None,'in_stock',7,1,'live-canonical'),
                  ('BB610-VLG-KENDAL-100ML',222.0,None,'in_stock',3,1,'live-alias'),
              ],
          )
          con.commit()
          con.close()

          os.environ['BB610_V5_DB_PATH']='/tmp/bb610-v5.sqlite3'
          os.environ['BB610_DB_PATH']=str(live)

          from backend.services.product_master_v5 import snapshot, resolve_sku
          from backend.catalog_provider import resolve_order_items, CatalogError

          canonical=resolve_sku('BB610-32DA4F652F73A1')
          assert canonical['price']==333.0
          assert canonical['commerce_source']=='runtime_sku_commerce'

          legacy=resolve_sku('BB610-VLG-KENDAL-100ML')
          assert legacy['price']==222.0
          assert legacy['commerce_source']=='runtime_sku_commerce'
          assert legacy['canonical_sku_id']=='BB610-32DA4F652F73A1'

          data=snapshot()
          kendal=next(x for x in data['products'] if x['product_id']=='kendal')
          ksku=next(x for x in kendal['skus'] if x['sku_id']=='BB610-32DA4F652F73A1')
          assert ksku['price']==333.0
          assert ksku['stock_qty']==7
          assert ksku['commerce_source']=='runtime_sku_commerce'
          kalias=next(x for x in data['sku_aliases'] if x['alias_sku_id']=='BB610-VLG-KENDAL-100ML')
          assert kalias['price']==222.0
          assert kalias['stock_qty']==3

          rows=resolve_order_items([{'sku':'BB610-32DA4F652F73A1','quantity':2}])
          assert len(rows)==1
          assert rows[0]['unit_price']==333.0
          assert rows[0]['line_total']==666.0
          assert rows[0]['name']
          assert rows[0]['snapshot']['canonical_sku']=='BB610-32DA4F652F73A1'
          assert rows[0]['snapshot']['commerce_source']=='runtime_sku_commerce'

          rows=resolve_order_items([{'sku':'BB610-VLG-KENDAL-100ML','quantity':1}])
          assert rows[0]['sku']=='BB610-VLG-KENDAL-100ML'
          assert rows[0]['unit_price']==222.0
          assert rows[0]['snapshot']['canonical_sku']=='BB610-32DA4F652F73A1'

          con=sqlite3.connect(live)
          con.execute("UPDATE sku_commerce SET availability='out_of_stock' WHERE sku='BB610-32DA4F652F73A1'")
          con.commit()
          con.close()
          try:
              resolve_order_items([{'sku':'BB610-32DA4F652F73A1','quantity':1}])
          except CatalogError as exc:
              assert 'unavailable' in str(exc)
          else:
              raise AssertionError('out-of-stock SKU was accepted')

          print('BB610 V5 LIVE COMMERCE + CHECKOUT: PASS')
          PY

      - name: V5 commerce admin contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sqlite3
          from pathlib import Path

          live=Path('/tmp/bb610-commerce-admin.sqlite3')
          if live.exists():
              live.unlink()
          con=sqlite3.connect(live)
          con.execute('''
            CREATE TABLE sku_commerce(
              sku TEXT PRIMARY KEY,
              price REAL,
              sale_price REAL,
              availability TEXT,
              stock_qty REAL,
              enabled INTEGER NOT NULL,
              updated_at TEXT
            )
          ''')
          con.execute(
              'INSERT INTO sku_commerce VALUES(?,?,?,?,?,?,?)',
              ('BB610-32DA4F652F73A1',999.0,None,'in_stock',11,1,'preexisting-live'),
          )
          con.commit()
          con.close()

          os.environ['BB610_V5_DB_PATH']='/tmp/bb610-v5.sqlite3'
          os.environ['BB610_DB_PATH']=str(live)

          from backend.services.product_commerce import (
              seed_from_catalog, commerce_map, admin_products, update_product,
          )

          seeded=seed_from_catalog()
          assert seeded['seen']==330, seeded
          assert seeded['created']==329, seeded

          cm=commerce_map()
          assert len(cm)==330, len(cm)
          assert cm['BB610-32DA4F652F73A1']['price']==999.0
          assert cm['BB610-32DA4F652F73A1']['updated_at']=='preexisting-live'
          assert 'BB610-VLG-KENDAL-100ML' in cm

          rows=admin_products()
          assert len(rows)==330, len(rows)
          canonical=next(x for x in rows if x['sku']=='BB610-32DA4F652F73A1')
          alias=next(x for x in rows if x['sku']=='BB610-VLG-KENDAL-100ML')
          assert canonical['source']=='product-master-v5'
          assert canonical['legacy_alias'] is False
          assert canonical['price']==999.0
          assert alias['source']=='product-master-v5-alias'
          assert alias['legacy_alias'] is True
          assert alias['canonical_sku_id']=='BB610-32DA4F652F73A1'

          updated=update_product(
              'BB610-32DA4F652F73A1',
              price=444.0,
              availability='in_stock',
              stock_qty=6,
              stock_qty_set=True,
              enabled=True,
          )
          assert updated['price']==444.0
          assert updated['stock_qty']==6
          assert updated['enabled'] is True

          updated=update_product(
              'PL-BB-1308041-TC',
              availability='request_price',
              enabled=True,
          )
          assert updated is not None
          assert updated['availability']=='request_price'

          print('BB610 V5 COMMERCE ADMIN: PASS')
          PY

      - name: Prices admin has one editor
        run: |
          set -euo pipefail
          node --check admin/products.js
          python - <<'PY'
          from pathlib import Path
          html=Path('admin/products.html').read_text(encoding='utf-8')
          js=Path('admin/products.js').read_text(encoding='utf-8')
          assert 'commerce-editor.js' not in html
          assert 'products.js' in html
          assert '/api/v1/admin/products' in Path('config/admin-config.js').read_text(encoding='utf-8')
          assert 'request_price' in html
          assert 'request_price' in js
          print('BB610 PRICES ADMIN SINGLE SOURCE: PASS')
          PY

      - name: V5 catalog admin contract
        env:
          BB610_V5_DB_PATH: /tmp/bb610-v5.sqlite3
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from backend.services.product_master_v5_admin import (
              list_products, get_product, update_product, update_sku,
              save_image, bind_media, unbind_media,
          )

          rows=list_products()
          assert len(rows)==86
          assert any(x['product_id']=='kendal' for x in rows)

          before=get_product('kendal')
          assert before and before['product_id']=='kendal'
          original_short=before['short_description']

          changed=update_product('kendal',{
              'short_description':'CI V5 EDIT',
              'public_enabled':True,
              'status':'active',
          })
          assert changed['short_description']=='CI V5 EDIT'

          sku=changed['skus'][0]
          original_label=sku['package_label']
          updated=update_sku('kendal',sku['sku_id'],{
              'package_label':original_label,
              'enabled':True,
          })
          assert updated['sku_id']==sku['sku_id']

          media=save_image('ci-v5.png',b'bb610-v5-ci-image')
          with_media=bind_media('kendal',media['media_id'],primary=True)
          assert any(x['media_id']==media['media_id'] for x in with_media['media'])
          cleaned=unbind_media('kendal',media['media_id'])
          assert all(x['media_id']!=media['media_id'] for x in cleaned['media'])

          update_product('kendal',{'short_description':original_short})
          print('BB610 V5 CATALOG ADMIN SERVICE: PASS')
          PY

      - name: V5 catalog admin frontend contract
        run: |
          set -euo pipefail
          python -m py_compile backend/services/product_master_v5_admin.py backend/product_master_v5_admin_api.py
          node --check admin/catalog.js
          node --check admin/admin-master-nav.js
          python - <<'PY'
          from pathlib import Path
          html=Path('admin/catalog.html').read_text(encoding='utf-8')
          js=Path('admin/catalog.js').read_text(encoding='utf-8')
          nav=Path('admin/admin-master-nav.js').read_text(encoding='utf-8')
          assert 'catalog-provenance.js' not in html
          assert 'product-maintenance.js' not in html
          assert 'catalog-v5' in js
          assert "['catalog.html','Каталог V5','card']" in nav
          assert "['catalog-workbench.html','Розширений каталог','adjust']" not in nav
          print('BB610 V5 CATALOG ADMIN FRONTEND: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bb610-product-master-v5
          path: /tmp/bb610-v5.sqlite3
          if-no-files-found: error
          retention-days: 7
