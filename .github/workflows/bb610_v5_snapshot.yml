name: BB610 V5 Production Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'ops/v5-snapshot-request.txt'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/bb610_vps
          chmod 600 ~/.ssh/bb610_vps
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture sanitized catalog snapshot
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@"$HOST" snapshot > bb610-v5-production.tar.gz
          test -s bb610-v5-production.tar.gz
          mkdir -p .v5-snapshot
          tar -xzf bb610-v5-production.tar.gz -C .v5-snapshot

      - name: Show sanitized gateway state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('.v5-snapshot/manifest.json',encoding='utf-8'))
          print(json.dumps(d.get('gateway',{}),ensure_ascii=False,indent=2))
          PY

      - name: Prepare identity-build snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp -a .v5-snapshot .v5-build-snapshot
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.v5-build-snapshot/db/sku_commerce.json')
          rows=json.loads(path.read_text(encoding='utf-8'))
          kept=[row for row in rows if not str(row.get('sku') or '').startswith('PL-')]
          removed=len(rows)-len(kept)
          path.write_text(json.dumps(kept,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Excluded derived V5 Plantlogic commerce identities: {removed}')
          PY

      - name: Build clean V5 staging
        shell: bash
        run: |
          set -euo pipefail
          python v5/build_stage.py \
            --snapshot .v5-build-snapshot \
            --json-out v5/staging/production-current.json \
            --md-out v5/staging/production-current.md
          python - <<'PY'
          import json
          d=json.load(open('v5/staging/production-current.json',encoding='utf-8'))
          print(json.dumps(d['summary'],ensure_ascii=False,indent=2))
          PY

      - name: Compile verified V5 content
        shell: bash
        run: |
          set -euo pipefail
          python v5/compile_content.py \
            --root . \
            --stage v5/staging/production-current.json \
            --out v5/content/verified-current.json

      - name: Restore Plantlogic application sections in V5
        shell: bash
        run: |
          set -euo pipefail
          python v5/extend_plantlogic_sections.py \
            --root . \
            --snapshot .v5-snapshot \
            --stage v5/staging/production-current.json \
            --content v5/content/verified-current.json
          python - <<'PY'
          import json
          d=json.load(open('v5/staging/production-current.json',encoding='utf-8'))
          print(json.dumps(d['summary'],ensure_ascii=False,indent=2))
          PY

      - name: Compile explicit V5 media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/img/v5/media
          python v5/compile_media.py \
            --root . \
            --snapshot .v5-snapshot \
            --stage v5/staging/production-current.json \
            --out v5/media/verified-current.json \
            --copy-dir assets/img/v5/media

      - name: Run V5 shadow gate
        shell: bash
        run: |
          set -euo pipefail
          python ops/v5_shadow_compare.py \
            --snapshot .v5-snapshot \
            --stage v5/staging/production-current.json \
            --content v5/content/verified-current.json \
            --media v5/media/verified-current.json \
            --json-out v5/reports/shadow-current.json \
            --md-out v5/reports/shadow-current.md

      - name: Commit staging result
        shell: bash
        run: |
          set -euo pipefail
          git add v5/staging/production-current.json v5/staging/production-current.md v5/content/verified-current.json v5/media/verified-current.json v5/reports/shadow-current.json v5/reports/shadow-current.md assets/img/v5/media
          if git diff --cached --quiet; then
            echo "No staging changes"
            exit 0
          fi
          git config user.name "bb610-v5-bot"
          git config user.email "bb610-v5-bot@users.noreply.github.com"
          git commit -m "Refresh V5 production staging"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: bb610-v5-production
          path: |
            bb610-v5-production.tar.gz
            v5/staging/production-current.json
            v5/staging/production-current.md
            v5/content/verified-current.json
            v5/media/verified-current.json
            v5/reports/shadow-current.json
            v5/reports/shadow-current.md
          if-no-files-found: error
          retention-days: 7
