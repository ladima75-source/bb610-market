name: BB610 V5 Production Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'ops/v5-snapshot-request.txt'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/bb610_vps
          chmod 600 ~/.ssh/bb610_vps
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Capture sanitized catalog snapshot
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@"$HOST" snapshot > bb610-v5-production.tar.gz
          test -s bb610-v5-production.tar.gz
          tar -tzf bb610-v5-production.tar.gz >/dev/null
          du -h bb610-v5-production.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bb610-v5-production
          path: bb610-v5-production.tar.gz
          if-no-files-found: error
          retention-days: 7
