name: BB610 V5 Storefront CI

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'js/data-source.js'
      - 'js/app.js'
      - 'js/catalog.js'
      - 'js/product.js'
      - 'assets/js/product-card-v2.js'
      - 'assets/js/product-card-v3-enhancements.js'
      - 'backend/services/product_master_v5.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'v5/**'
      - '.github/workflows/bb610_v5_storefront_ci.yml'
  pull_request:
    paths:
      - 'js/data-source.js'
      - 'js/app.js'
      - 'js/catalog.js'
      - 'js/product.js'
      - 'assets/js/product-card-v2.js'
      - 'assets/js/product-card-v3-enhancements.js'
      - 'backend/services/product_master_v5.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'v5/**'
      - '.github/workflows/bb610_v5_storefront_ci.yml'

permissions:
  contents: read

jobs:
  storefront-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/data-source.js
          node --check js/app.js
          node --check js/catalog.js
          node --check js/product.js
          node --check assets/js/product-card-v2.js
          node --check assets/js/product-card-v3-enhancements.js

      - name: Build V5 DB and export snapshot
        run: |
          set -euo pipefail
          python v5/bootstrap_db.py --out /tmp/bb610-v5.sqlite3
          BB610_V5_DB_PATH=/tmp/bb610-v5.sqlite3 python - <<'PY'
          import json
          from pathlib import Path
          from backend.services.product_master_v5 import snapshot
          Path('/tmp/v5.json').write_text(
              json.dumps(snapshot(), ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Browser adapter contract
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');
          const vm=require('vm');
          global.window={
            BB610_CATALOG:{
              categories:[
                {id:'nutrition',name:'Живлення',short_name:'Живлення',enabled:true,order:1},
                {id:'biostimulation',name:'Біостимуляція',short_name:'Біостимуляція',enabled:true,order:2},
                {id:'containers',name:'Горщики',short_name:'Горщики',enabled:true,order:3},
                {id:'protection',name:'Захист рослин',short_name:'Захист рослин',enabled:true,order:4},
                {id:'other',name:'Інше',short_name:'Інше',enabled:true,order:5},
              ],
              products:[{id:'legacy-static-should-disappear'}],skus:[{id:'LEGACY-STATIC-SKU',product_id:'legacy-static-should-disappear'}],variants:[{id:'legacy-variant'}],brands:[],solutions:[],bundles:[]
            },
            BB610_STOREFRONT_V5:true,
          };
          global.location={search:'?v5=1'};
          global.URLSearchParams=URLSearchParams;
          vm.runInThisContext(fs.readFileSync('js/data-source.js','utf8'),{filename:'js/data-source.js'});
          if(window.BB610_CATALOG.products.length||window.BB610_CATALOG.skus.length||window.BB610_CATALOG.variants.length)throw new Error('static runtime identities entered storefront');
          const d=JSON.parse(fs.readFileSync('/tmp/v5.json','utf8'));
          const DS=window.BB610_DATA_SOURCE;
          DS._applyV5(d);
          if(DS.mode!=='bb610-product-master-v5')throw new Error('wrong mode');
          if(DS.products().length!==(d.products||[]).length)throw new Error('public product count');
          const expectedSkus=(d.products||[]).reduce((n,p)=>n+(p.skus||[]).length,0);
          if(DS.skus().length!==expectedSkus)throw new Error('public SKU count');
          const kendal=DS.product('kendal');
          if(!kendal||!kendal.image||!kendal.sources?.length)throw new Error('Kendal projection');
          const canonical=DS.sku('BB610-32DA4F652F73A1');
          if(!canonical||canonical.price!==220)throw new Error('canonical Kendal price');
          const legacy=DS.sku('BB610-VLG-KENDAL-100ML');
          if(!legacy||legacy.price!==220||legacy.canonical_sku_id!=='BB610-32DA4F652F73A1')throw new Error('legacy alias must inherit canonical commerce');
          if((DS.staticProductMedia('kendal')||null)!==null)throw new Error('legacy static media leaked into V5');
          const plantlogic=DS.products().filter(x=>String(x.brand||'').toLowerCase()==='plantlogic');
          if(plantlogic.length!==65)throw new Error('Plantlogic manual storefront card count');
          const pots=plantlogic.filter(x=>x.category_id==='containers');
          const accessories=plantlogic.filter(x=>x.category_id==='accessories');
          const bagBases=plantlogic.filter(x=>x.category_id==='bag_bases');
          const strawberry=plantlogic.filter(x=>x.category_id==='strawberry');
          if(pots.length!==41)throw new Error('Plantlogic pot storefront card count');
          if(accessories.length!==18)throw new Error('Plantlogic accessories category');
          if(bagBases.length!==0)throw new Error('Plantlogic bag_bases must not be a technical storefront category');
          if(strawberry.length!==6)throw new Error('Plantlogic strawberry category');
          const plantlogicSkus=plantlogic.flatMap(p=>DS.skusForProduct(p.id));
          if(plantlogicSkus.length!==119)throw new Error('Plantlogic total SKU count');
          if(DS.product('plantlogic-ground-cover-1600201'))throw new Error('manual REMOVE ground cover leaked');
          if(DS.product('plantlogic-zephyr-1301133'))throw new Error('legacy Zephyr leaked');
          if(DS.product('plantlogic-universal-square-40l-legacy-1309040'))throw new Error('legacy 40L square leaked');
          if(DS.product('plantlogic-universal-round-25l-legacy-1309003')?.id!=='plantlogic-25-round-1308125')throw new Error('legacy 25L round must resolve to 1308125');
          if(!DS.product('plantlogic-blueberry-cooling-cover'))throw new Error('Cooling Skirt missing');
          if(DS.product('plantlogic-kratos-rivus-grow-bag-8l-1500010')?.category_id!=='containers')throw new Error('1500010 must be product/container');
          if(DS.product('plantlogic-vegetable-pot-8l-1305008'))throw new Error('unverified 1305008 leaked to storefront');
          if(DS.product('plantlogic-nursery-tray-1302048'))throw new Error('unverified 1302048 leaked to storefront');
          const potSkus=pots.flatMap(p=>DS.skusForProduct(p.id));
          if(potSkus.length!==71)throw new Error('Plantlogic pot SKU count');
          const round20=DS.product('plantlogic-blueberry-round-20l-1308020');
          if(JSON.stringify(round20?.plantlogic_sections)!==JSON.stringify(['blueberry']))throw new Error('blueberry pot leaked into another crop section');
          const drain25=DS.product('plantlogic-25l-round-drainage-1304125');
          if(JSON.stringify(drain25?.plantlogic_sections)!==JSON.stringify(['blueberry']))throw new Error('25L canonical public section mapping');
          const catalogSource=fs.readFileSync('js/catalog.js','utf8');
          if(!catalogSource.includes("id:'universal',label:'Універсальні'"))throw new Error('Universal public section label');
          // V2 section membership comes only from canonical __plantlogic_sections;
          // no static per-product section-title override is allowed.
          const sectionBlock=catalogSource.slice(catalogSource.indexOf('const plantlogicSectionOrder=['),catalogSource.indexOf('const plantlogicSectionsFor='));
          for(const marker of ["id:'blueberry'","id:'rubus'","id:'strawberry'","id:'vegetable'","id:'universal'","id:'accessories'"]){
            if(!sectionBlock.includes(marker))throw new Error('missing V2 public section '+marker);
          }
          if(sectionBlock.includes("id:'bag_bases'")||sectionBlock.includes("id:'garden'"))throw new Error('legacy Plantlogic public section leaked');
          if(JSON.stringify(DS.product('plantlogic-pot-anchor')?.plantlogic_sections)!==JSON.stringify(['accessories']))throw new Error('accessories section projection');
          if(JSON.stringify(DS.product('plantlogic-vf-bag-base-12010300')?.plantlogic_sections)!==JSON.stringify(['accessories']))throw new Error('bag base must project to Accessories');
          if(JSON.stringify(DS.product('plantlogic-18l-strawberry-trough-1305909')?.plantlogic_sections)!==JSON.stringify(['strawberry']))throw new Error('strawberry section projection');
          if(DS.product('blueberry-round-pots')?.id!=='plantlogic-blueberry-round-20l-1308020')throw new Error('legacy grouped product alias');
          if(DS.sku('PL-BB-1308031-BK')?.product_id!=='plantlogic-blueberry-round-30l-v-ribs-1308031')throw new Error('split round 30L product identity');
          const anchor=DS.product('plantlogic-pot-anchor');
          if(anchor?.name!=='Анкер для фіксації горщика'||anchor?.model!=='Pot Anchor')throw new Error('model/title projection');
          const parallel=DS.sku('PL-BB-1308305-BK');
          if(parallel?.canonical_title!=='Горщик для лохини 30 л круглий з паралельними U-пазами')throw new Error('canonical SKU title');
          if(DS.product('plantlogic-4-7l-square-cold-storage-13050040')?.name!=='Горщик для малини та ожини 4,7 л квадратний для технології long-cane')throw new Error('4.7L long-cane title');
          if(DS.product('plantlogic-7l-square-cold-storage-1305071')?.name!=='Горщик для малини та ожини 7 л квадратний для технології long-cane')throw new Error('7L long-cane title');
          const productSource=fs.readFileSync('js/product.js','utf8');
          for(const marker of [
            'hasColorVariants',
            'skuColorLabel',
            'colorOnlySelector',
            "selectorLabel=hasColorVariants",
            'Фото показує конструкцію моделі; окреме фото цього кольору виробник не надав.',
            'hasColorVariants?clicked:'
          ]){
            if(!productSource.includes(marker))throw new Error('Plantlogic color SKU selector contract: '+marker);
          }
          const colorSkus=DS.skusForProduct('plantlogic-10l-drainage-1307110');
          if(colorSkus.filter(x=>x.attributes?.color_label).length!==3)throw new Error('Plantlogic 1307110 color SKU projection');
          for(const label of [
            'Горщики та рішення для контейнерного вирощування',
            'Горщики та рішення для long-cane і субстрату',
            'Жолоби та системи для субстратного вирощування',
            'Горщики, мішки та основи для субстрату',
            'Рішення для різних культур і технологій',
            'Основи, кліпси, лізиметри та комплектуючі'
          ]){
            if(!catalogSource.includes(label))throw new Error('Plantlogic section buyer copy: '+label);
          }
          for(const legacySubtitle of ['Blueberry Production','Rubus Production','Strawberry Production','Vegetable Production','Accessories']){
            if(catalogSource.includes("subtitle:'"+legacySubtitle+"'"))throw new Error('Legacy English Plantlogic section subtitle: '+legacySubtitle);
          }
          if(!catalogSource.includes('containerLogicalSort'))throw new Error('container logical sorting');
          for(const marker of [
            "blueberry:[",
            "'support','other'",
            "vegetable:['pot-other','drainage','grow-bag','base'",
            "universal:[",
            "accessories:['grow-bag','base','trough','support'"
          ]){
            if(!catalogSource.includes(marker))throw new Error('Plantlogic merchandising sorting contract: '+marker);
          }
          if(!catalogSource.includes("name.includes('кліпс')")||!catalogSource.includes("return 'support'"))throw new Error('Plantlogic support-item classification');
          if(!catalogSource.includes(".replace(/\\s*[—-]\\s*арт\\.?"))throw new Error('Plantlogic catalog title cleaner');
          const ordered=DS._orderedPlantlogicMedia([
            {path:'/media/1309008-bottom.jpg',alt:'bottom view',is_primary:true,sort_order:0},
            {path:'/media/1309008-front.jpg',alt:'front hero',is_primary:false,sort_order:9},
            {path:'/media/1309008-tech-sheet.jpg',alt:'technical drawing',is_primary:false,sort_order:1},
            {path:'/media/1309008-side.jpg',alt:'side view',is_primary:false,sort_order:2},
            {path:'/media/4.7L-SQ-13050040-FRENTE.jpg',alt:'Plantlogic 13050040 FRENTE',is_primary:false,sort_order:20},
            {path:'/media/7-Liter-Drainage-Collection-pot_Item_1307107.jpg',alt:'Plantlogic 1307107 clean item',is_primary:false,sort_order:30},
            {path:'/media/5LDC_D.jpg',alt:'Plantlogic 1306051 5LDC_D.jpg',is_primary:true,sort_order:0},
          ]);
          if(ordered.length!==7)throw new Error('Plantlogic media preservation');
          if(!ordered[0].path.includes('front'))throw new Error('Plantlogic hero/front ordering');
          if(ordered.findIndex(x=>x.path.includes('FRENTE'))>2)throw new Error('Plantlogic FRENTE ordering');
          if(ordered.findIndex(x=>x.path.includes('Item_1307107'))>2)throw new Error('Plantlogic clean item ordering');
          if(ordered.findIndex(x=>x.path.includes('5LDC_D'))>=ordered.findIndex(x=>x.path.includes('tech-sheet')))throw new Error('Plantlogic feature/technical tail ordering');
          if(!ordered.at(-1).path.includes('tech-sheet'))throw new Error('Plantlogic technical media must be last');
          console.log('BB610 V5 STOREFRONT ADAPTER: PASS');
          JS
