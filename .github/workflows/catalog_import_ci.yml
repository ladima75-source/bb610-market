name: Unified Catalog Import CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog_import_ci.yml'
      - 'backend/services/product_cards_v3_catalog_import.py'
      - 'backend/services/product_cards_v3_import.py'
      - 'backend/services/product_commerce.py'
      - 'backend/services/catalog_cms.py'
      - 'backend/catalog_import_api.py'
      - 'admin/catalog-import.js'
      - 'admin/catalog-import.html'
      - 'js/product.js'
      - 'assets/js/product-card-v2.js'
      - 'assets/css/product-card-v2-20f1.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer:
    runs-on: ubuntu-latest
    env:
      BB610_DB_PATH: /tmp/bb610-catalog-import-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax checks
        run: |
          python -m py_compile backend/services/product_cards_v3_catalog_import.py backend/catalog_import_api.py
          node --check admin/catalog-import.js
          node --check js/product.js
          node --check assets/js/product-card-v2.js
          grep -q '^\.mpc-shell,' assets/css/product-card-v2-20f1.css
          grep -q 'grid-template-columns:minmax(0,1.15fr)' assets/css/product-card-v2-20f1.css
      - name: Preview Apply Verify Rollback smoke test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import io
          import json

          from backend.db import migrate
          migrate()

          from backend.services import product_cards_v3_catalog_import as imp

          # 1) New product: three spreadsheet rows must become one card / three SKU.
          raw = imp.template_csv()
          preview = imp.preview('template.csv', raw)
          print(json.dumps(preview, ensure_ascii=False, indent=2))
          assert preview['valid'] is True, preview['errors']
          assert preview['summary']['products'] == 1
          assert preview['summary']['sku_rows'] == 3
          assert preview['summary']['create_commerce_products'] == 1
          assert preview['summary']['create_commerce_skus'] == 3

          result = imp.apply(preview['token'])
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert result['verified'] is True
          assert result['applied_products'] == 1
          assert result['commerce_rows'] == 3

          rows = imp.export_rows()
          example = [r for r in rows if r.get('slug') == 'example-product']
          assert len(example) == 3
          prices = sorted(float(r['price']) for r in example)
          assert prices == [100.0, 300.0, 900.0]
          assert all(r.get('commerce_sku_key') for r in example)
          # Rich Product Card v3 content must remain exportable for CSV/XLSX round-trips.
          required_content_columns = {
              'description', 'benefits_json', 'how_it_works', 'application',
              'composition', 'characteristics_json', 'seo_title', 'seo_description'
          }
          assert required_content_columns.issubset(set(imp.HEADERS))
          assert example[0].get('description') == 'Повний опис товару'
          assert json.loads(example[0].get('benefits_json') or '[]')
          assert json.loads(example[0].get('characteristics_json') or '[]')

          # 2) Critical regression: existing card/SKU, price-only CSV row.
          # No title/package fuzzy matching is allowed or needed: exact product_id + sku_id
          # resolves the v3 identity, and the saved commerce binding resolves the price row.
          target = next(r for r in example if r.get('sku_code') == 'EXAMPLE-100G')
          buf = io.StringIO(newline='')
          writer = csv.DictWriter(buf, fieldnames=imp.HEADERS)
          writer.writeheader()
          row = {key: '' for key in imp.HEADERS}
          row['product_id'] = target['product_id']
          row['sku_id'] = target['sku_id']
          row['price'] = '123.45'
          writer.writerow(row)
          price_only = ('\ufeff' + buf.getvalue()).encode('utf-8')

          p2 = imp.preview('price-only.csv', price_only)
          print(json.dumps(p2, ensure_ascii=False, indent=2))
          assert p2['valid'] is True, p2['errors']
          assert p2['summary']['products'] == 1
          assert p2['summary']['update_products'] == 1
          assert p2['summary']['sku_rows'] == 1
          assert p2['summary']['update_skus'] == 1
          assert p2['summary']['commerce_rows'] == 1
          assert len(p2['changes']) == 1
          assert float(p2['changes'][0]['price_before']) == 100.0
          assert float(p2['changes'][0]['price_after']) == 123.45

          r2 = imp.apply(p2['token'])
          assert r2['verified'] is True
          rows2 = imp.export_rows()
          changed = next(r for r in rows2 if r.get('sku_id') == target['sku_id'])
          assert float(changed['price']) == 123.45

          # Price-only rollback must return the exact previous value.
          rb2 = imp.rollback(r2['backup'])
          assert rb2['restored'] == r2['backup']
          rows3 = imp.export_rows()
          restored = next(r for r in rows3 if r.get('sku_id') == target['sku_id'])
          assert float(restored['price']) == 100.0

          # Restore repository fixture state from before the whole smoke test.
          rb = imp.rollback(result['backup'])
          print(json.dumps(rb, ensure_ascii=False, indent=2))
          assert rb['restored'] == result['backup']
          PY
