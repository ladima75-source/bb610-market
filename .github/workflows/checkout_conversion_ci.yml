name: BB610 Checkout Conversion CI

on:
  push:
    branches: [main]
    paths:
      - 'config/delivery-config.js'
      - 'js/app.js'
      - 'js/cart.js'
      - 'js/checkout.js'
      - 'backend/services/orders.py'
      - '.github/workflows/checkout_conversion_ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/cart.js
          node --check js/checkout.js
          node --check config/delivery-config.js
      - name: Python syntax
        run: python -m py_compile backend/services/orders.py
      - name: Verify checkout conversion rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('js/app.js').read_text()
          cart=Path('js/cart.js').read_text()
          checkout=Path('js/checkout.js').read_text()
          config=Path('config/delivery-config.js').read_text()
          orders=Path('backend/services/orders.py').read_text()
          checks={
            'cod_min_config': 'codMinOrderUah: 500' in config and 'minOrderUah:' not in config,
            'cart_checkout_always_available': 'ОФОРМИТИ ЗАМОВЛЕННЯ' in cart and 'minOrderReady' not in cart,
            'cart_prepaid_no_min_copy': 'без мінімальної суми' in cart,
            'mini_cart_cta': 'cart-added-notice' in app and 'ОФОРМИТИ ЗАМОВЛЕННЯ' in app,
            'checkout_cod_gate_only': "method!=='cod'||total>=codMinOrder" in checkout,
            'checkout_online_first': 'online_card:0,bank_transfer:1,cod:2' in checkout,
            'backend_cod_gate_only': "payment_method=='cod' and subtotal < COD_MIN_ORDER_UAH" in orders,
            'legacy_blanket_min_removed': "raise ValueError('MIN_ORDER_AMOUNT_500_UAH')" not in orders,
            'view_cart_event': "pushEvent('view_cart'" in cart,
            'begin_checkout_event': "pushEvent('begin_checkout'" in checkout,
          }
          print(checks)
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('failed checks: '+','.join(failed))
          PY
