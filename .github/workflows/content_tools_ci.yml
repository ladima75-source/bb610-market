name: Content Tools CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/update_brexil_zn_application.py'
      - '.github/workflows/content_tools_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile backend/update_brexil_zn_application.py
