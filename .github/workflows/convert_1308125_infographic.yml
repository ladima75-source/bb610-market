name: Convert 1308125 infographic
# rebuild approved source
on:
  push:
    paths:
      - '.github/workflows/convert_1308125_infographic.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert approved AVIF to WebP
        run: |
          ffmpeg -y -i assets/img/plantlogic/1308125-infographic.avif -frames:v 1 -vf "scale=1200:-2" -c:v libwebp -q:v 88 assets/img/plantlogic/1308125-infographic.webp
          test -s assets/img/plantlogic/1308125-infographic.webp
      - name: Commit WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/plantlogic/1308125-infographic.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add web-safe 1308125 infographic"
          git push
