name: MaGelle Public QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/magelle-public-qa.txt']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Public checks
        run: |
          set -euo pipefail
          check_code() { u="$1"; want="$2"; got="$(curl -L -sS -o /tmp/out -w '%{http_code}' "$u")"; echo "$got $u"; test "$got" = "$want"; }
          check_code https://api.magelle.com.ua/api/health 200
          grep -q '"ok": true' /tmp/out
          for sku in MG-AS-DEL-CHO MG-OF-DEL-CHO MG-OF-VYR-MLK; do
            code="$(curl -L -sS -o "/tmp/$sku" -w '%{http_code}' "https://api.magelle.com.ua/media/$sku.jpg")"
            type="$(file -b --mime-type "/tmp/$sku")"
            size="$(wc -c < "/tmp/$sku")"
            echo "$code $type $size https://api.magelle.com.ua/media/$sku.jpg"
            test "$code" = "200"
            test "$size" -gt 10000
          done
          check_code https://magelle.com.ua/catalog.html 200
          check_code https://magelle.com.ua/checkout.html 200
          check_code https://magelle.com.ua/organic-flare-vyraznyi-molochnyi.html 200
          grep -q 'Product' /tmp/out
