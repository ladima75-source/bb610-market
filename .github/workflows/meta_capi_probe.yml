name: BB610 Meta CAPI Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta_capi_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Meta CAPI configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://api.market.bb610.com.ua/api/v1/analytics/meta-capi'
          body={
            'event_name':'ViewContent',
            'event_id':'bb610-meta-capi-probe-20260928',
            'event_source_url':'https://market.bb610.com.ua/?meta_capi_probe=1',
            'currency':'UAH',
            'contents':[]
          }
          req=urllib.request.Request(
            url,
            data=json.dumps(body).encode('utf-8'),
            method='POST',
            headers={
              'Content-Type':'application/json',
              'Accept':'application/json',
              'Origin':'https://market.bb610.com.ua',
              'User-Agent':'BB610-Meta-CAPI-Probe/1.0'
            }
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data=json.loads(resp.read().decode('utf-8'))
          print('META_CAPI_PROBE', json.dumps(data, ensure_ascii=False))
          reason=data.get('reason')
          if reason=='not_configured':
              raise SystemExit(2)
          if not data.get('accepted'):
              raise SystemExit('Meta CAPI endpoint is present but upstream/configuration probe failed: '+json.dumps(data,ensure_ascii=False))
          print('META_CAPI_CONFIGURED', True)
          PY
