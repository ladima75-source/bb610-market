name: Plantlogic live canonical CI

on:
  push:
    branches: [main]
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'backend/services/plantlogic_v2_final.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'backend/services/plantlogic_v2_customer_content.py'
      - 'backend/services/plantlogic_manual_audit_20260929.py'
      - 'js/data-source.js'
      - 'js/catalog.js'
      - '.github/workflows/plantlogic_live_accessories_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployed V2 and verify live canonical catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          spec=json.loads(Path('data/product_content/plantlogic_v2_final_20260928.json').read_text(encoding='utf-8'))
          from backend.services.plantlogic_manual_audit_20260929 import (
              REMOVE_PRODUCTS, REFERENCE_ONLY_PRODUCTS, COOLING_PRODUCT_ID, COOLING_SKU_ID
          )
          hidden=set(REMOVE_PRODUCTS)|set(REFERENCE_ONLY_PRODUCTS)
          public_hidden_numbers=set(str(x) for x in (spec.get('expected') or {}).get('public_hidden') or [])
          public_hidden_ids={
              x['canonical_product_id'] for x in spec['canonical_products']
              if any(str(n) in public_hidden_numbers for n in x.get('manufacturer_product_numbers') or [])
          }
          hidden |= public_hidden_ids
          expected_ids={x['canonical_product_id'] for x in spec['canonical_products'] if x['canonical_product_id'] not in hidden}
          expected_ids.add(COOLING_PRODUCT_ID)
          expected_skus={
              s['sku_id'] for x in spec['canonical_products']
              if x['canonical_product_id'] not in hidden
              for s in x.get('skus') or []
          }
          expected_skus.add(COOLING_SKU_ID)
          expected_sections={'blueberry','rubus','strawberry','vegetable','universal','accessories'}

          def sections(product):
              for row in product.get('characteristics') or []:
                  if str(row.get('label') or '').strip()=='__plantlogic_sections':
                      return {x.strip() for x in str(row.get('value') or '').split('|') if x.strip()}
              return set()

          last=''
          live=None
          for _ in range(40):
              try:
                  with urllib.request.urlopen('https://api.market.bb610.com.ua/api/v1/catalog/v5',timeout=20) as r:
                      candidate=json.load(r)
                  rows=[p for p in candidate.get('products') or [] if str(p.get('brand') or '').lower()=='plantlogic']
                  ids={p.get('product_id') or p.get('id') for p in rows}
                  skus={s.get('sku_id') or s.get('id') for p in rows for s in p.get('skus') or []}
                  if ids==expected_ids and skus==expected_skus:
                      live=candidate
                      break
                  last=f'products={len(ids)} skus={len(skus)} missing_products={len(expected_ids-ids)} missing_skus={len(expected_skus-skus)}'
              except Exception as exc:
                  last=repr(exc)
              time.sleep(15)
          if live is None:
              raise SystemExit('deployed V2 not observed: '+last)

          rows=[p for p in live.get('products') or [] if str(p.get('brand') or '').lower()=='plantlogic']
          ids={p.get('product_id') or p.get('id') for p in rows}
          skus={s.get('sku_id') or s.get('id') for p in rows for s in p.get('skus') or []}
          assert ids==expected_ids and len(ids)==65
          assert skus==expected_skus and len(skus)==119
          assert 'plantlogic-zephyr-v2-hose-clip-1700149' not in ids
          assert 'PL-1700149' not in skus
          assert 'plantlogic-vegetable-pot-8l-1305008' not in ids
          assert 'PL-1305008-BK' not in skus
          assert 'plantlogic-nursery-tray-1302048' not in ids
          assert 'PL-1302048' not in skus

          for p in rows:
              sec=sections(p)
              assert len(sec)==1 and sec <= expected_sections, (p.get('product_id'),sec)
              assert 'bag_bases' not in sec and 'garden' not in sec
              if str(p.get('name') or '').startswith('Горщик'):
                  assert p.get('category_id')!='accessories', p.get('product_id')

          by_id={p.get('product_id') or p.get('id'):p for p in rows}
          banned=(
              'Дані та Product # звірені',
              'Офіційна модель Plantlogic',
              'Офіційне джерело',
              'не специфікован',
              'Bag Bases',
              'Bag Base',
              'Slab base',
              'grow bag',
              'open-top grow bags',
              'Hose fix',
          )
          for p in rows:
              customer=' '.join(str(p.get(k) or '') for k in (
                  'short_description','description','application','composition','how_it_works'
              ))
              customer+=' '+json.dumps(p.get('benefits') or [],ensure_ascii=False)
              public_chars=[
                  x for x in (p.get('characteristics') or [])
                  if not str(x.get('label') or '').strip().startswith('__')
              ]
              customer+=' '+json.dumps(public_chars,ensure_ascii=False)
              assert not any(term.lower() in customer.lower() for term in banned), (p.get('product_id'),'banned customer text')
              assert not any('http://' in str(x.get('value') or '').lower() or 'https://' in str(x.get('value') or '').lower() for x in public_chars)
          assert 'Мішок для субстрату з інтегрованою жорсткою основою Culti-base' in str(by_id['plantlogic-culti-base'].get('short_description') or '')
          assert 'Для контейнерного вирощування лохини у субстраті.' == str(by_id['plantlogic-blueberry-round-25l-u-grooves-1308026'].get('application') or '')

          required={
              'plantlogic-pot-anchor',
              'plantlogic-vf-bag-base-12010300',
              'plantlogic-rivus-slab-base',
              'plantlogic-rivus-end-cap',
              'plantlogic-blueberry-square-40l-u-grooves-side-holes-16mm-13090400',
              'plantlogic-blueberry-square-40l-u-grooves-side-holes-20mm-13090440',
          }
          assert required <= ids
          print('PLANTLOGIC LIVE MANUAL OVERRIDE: 65 PRODUCTS / 119 SKU / 6 SECTIONS PASS; 1700149, 1305008, 1302048 HIDDEN')
          PY
