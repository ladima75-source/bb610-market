name: Plantlogic market-test CI

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'tools/audit_plantlogic_v2_final.py'
      - 'backend/services/plantlogic_v2_final.py'
      - 'backend/services/product_master_v5.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'backend/services/price_requests.py'
      - 'backend/services/telegram_notifications.py'
      - 'js/app.js'
      - 'js/product.js'
      - 'js/cart.js'
      - 'admin/price-requests.js'
      - '.github/workflows/plantlogic_market_test_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile             backend/services/plantlogic_v2_final.py             backend/services/product_master_v5.py             backend/services/product_master_v5_migrations.py             backend/services/price_requests.py             backend/services/telegram_notifications.py             tools/audit_plantlogic_v2_final.py
          node --check js/app.js
          node --check js/product.js
          node --check js/cart.js
          node --check admin/price-requests.js

      - name: Canonical PlantLogic V2 market contract
        run: |
          set -euo pipefail
          python tools/audit_plantlogic_v2_final.py

      - name: Request-price storefront and lead safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          spec=json.loads(Path('data/product_content/plantlogic_v2_final_20260928.json').read_text(encoding='utf-8'))
          assert spec['expected']['canonical_products']==78
          assert spec['expected']['total_sku']==133
          assert spec['expected']['new_sku']==27
          assert spec['expected']['to_verify']==['1205018','1205019']

          app=Path('js/app.js').read_text(encoding='utf-8')
          product=Path('js/product.js').read_text(encoding='utf-8')
          cart=Path('js/cart.js').read_text(encoding='utf-8')
          admin=Path('admin/price-requests.js').read_text(encoding='utf-8')
          assert 'isPriceRequestSku' in app
          assert 'Ціна за запитом' in app
          assert '/api/v1/price-requests' in app
          assert 'openPriceRequest' in product
          assert 'Ціна за запитом' in product
          assert 'Під замовлення' in product
          assert 'BB610.skuName' in cart
          assert '/api/v1/admin/price-requests' in admin
          print('PLANTLOGIC V2 REQUEST-PRICE STOREFRONT: PASS')
          PY
