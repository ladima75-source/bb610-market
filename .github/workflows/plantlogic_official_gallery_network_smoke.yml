name: Plantlogic official gallery network smoke

on:
  push:
    branches: [main]
    paths:
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'data/product_content/plantlogic_pots_v1_20260918.json'
      - '.github/workflows/plantlogic_official_gallery_network_smoke.yml'
  workflow_dispatch:

jobs:
  gallery-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve verified official gallery candidates
        run: |
          python backend/tools_apply_plantlogic_official_gallery_20260919.py
