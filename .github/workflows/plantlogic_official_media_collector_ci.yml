name: Plantlogic official media collector CI

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'tools/build_plantlogic_v2_media.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'data/product_content/plantlogic_v2_media_manifest_20260928.json'
      - 'data/product_content/plantlogic_v2_media_audit_20260928.json'
      - '.github/workflows/plantlogic_official_media_collector_ci.yml'
  pull_request:
    paths:
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'tools/build_plantlogic_v2_media.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - '.github/workflows/plantlogic_official_media_collector_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collector and committed media contract
        run: |
          set -euo pipefail
          python -m py_compile backend/tools_collect_plantlogic_official_media_20260918.py tools/build_plantlogic_v2_media.py tools/audit_plantlogic_v2_final.py
          python tools/audit_plantlogic_v2_final.py --require-media

      - name: Official-only provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/product_content/plantlogic_v2_media_manifest_20260928.json').read_text(encoding='utf-8'))
          allowed=('https://getplantlogic.com/','https://www.getplantlogic.com/','https://i0.wp.com/','https://i1.wp.com/','https://i2.wp.com/')
          for row in d.get('media') or []:
              assert str(row.get('path') or '').startswith('/assets/img/v5/media/')
              src=str(row.get('source_url') or '')
              if src:
                  assert src.startswith(allowed), src
          print('PLANTLOGIC V2 OFFICIAL MEDIA PROVENANCE: PASS')
          PY
