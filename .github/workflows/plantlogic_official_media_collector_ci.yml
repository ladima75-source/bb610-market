name: Plantlogic official media collector CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'backend/tools_apply_plantlogic_official_media_20260918.py'
      - 'data/product_content/plantlogic_pots_v1_20260918.json'
      - '.github/workflows/plantlogic_official_media_collector_ci.yml'
  pull_request:
    paths:
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'backend/tools_apply_plantlogic_official_media_20260918.py'
      - 'data/product_content/plantlogic_pots_v1_20260918.json'
      - '.github/workflows/plantlogic_official_media_collector_ci.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax
        run: |
          python -m py_compile backend/tools_collect_plantlogic_official_media_20260918.py
          python -m py_compile backend/tools_apply_plantlogic_official_media_20260918.py

      - name: Validate collector contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from backend import tools_collect_plantlogic_official_media_20260918 as c

          doc=json.loads(Path('data/product_content/plantlogic_pots_v1_20260918.json').read_text())
          assert len(doc['products'])==34
          assert sum(len(x.get('skus') or []) for x in doc['products'])==37
          assert c.EXPECTED_PRODUCTS==34
          assert c.EXPECTED_SKUS==37

          assert c.SOURCE_OVERRIDES['plantlogic-zephyr-v2'].endswith('/portfolio-items/zephyr-v2/')
          assert c.SOURCE_OVERRIDES['plantlogic-25l-round-new-1308125'].endswith('/new-25-liter-round-pot/')
          assert c.SOURCE_OVERRIDES['plantlogic-25l-round-u-grooves-1308026'].endswith('/25-liter-round-pot-with-u-grooves/')
          assert c.SOURCE_OVERRIDES['plantlogic-30l-round-v-rib-1308031'].endswith('/30-liter-round-v-rib/')
          assert c.SOURCE_OVERRIDES['plantlogic-35l-round-u-grooves-13080350'].endswith('/35-liter-round-pot-with-u-grooves-for-blueberries/')

          assert c.normalize_url(
              'https://getplantlogic.com/portfolio-items/x/',
              '/wp-content/uploads/a.jpg'
          ) == 'https://getplantlogic.com/wp-content/uploads/a.jpg'
          assert c.normalize_url(
              'https://getplantlogic.com/',
              'https://i0.wp.com/getplantlogic.com/wp-content/uploads/a.jpg'
          ) == 'https://i0.wp.com/getplantlogic.com/wp-content/uploads/a.jpg'
          assert c.normalize_url(
              'https://getplantlogic.com/',
              'https://evil.example/a.jpg'
          ) == ''

          # Foreign Product # images must never win a different product.
          score,reasons,identity = c._candidate_score(
              'https://getplantlogic.com/wp-content/uploads/2016/04/Plantlogic-8-liter-square-1309008-side-1.jpg',
              'img:src',
              55,
              '',
              ['1308041'],
              '40 Liter Round Pot with U-Grooves',
          )
          assert score <= -500
          assert identity is False
          assert any('foreign_product_no=' in x for x in reasons)

          # Exact Product # in an official image URL is high confidence.
          score,reasons,identity = c._candidate_score(
              'https://getplantlogic.com/wp-content/uploads/2024/03/40-liter-round-pot-with-U-grooves_Item_1308041-2.jpg',
              'img:src',
              55,
              '40 Liter Round Pot with U-Grooves',
              ['1308041'],
              '40 Liter Round Pot with U-Grooves',
          )
          assert score >= 200
          assert identity is True
          assert any('product_no=1308041' in x for x in reasons)

          # Generic OG metadata without identity cannot be high confidence.
          score,reasons,identity = c._candidate_score(
              'https://getplantlogic.com/wp-content/uploads/generic-hero.jpg',
              'og:image',
              45,
              '',
              ['1308041'],
              '40 Liter Round Pot with U-Grooves',
          )
          assert score <= 25
          assert identity is False

          # Exact model name without Product # is still high confidence when
          # volume + shape are present on the already verified official page.
          score,reasons,identity = c._candidate_score(
              'https://getplantlogic.com/wp-content/uploads/20-liter-square-pot-main.jpg',
              'img:src',
              55,
              '20 Liter Square Pot',
              ['1309020'],
              '20 Liter Square Pot',
          )
          assert score >= 100
          assert identity is True
          assert 'volume_match' in reasons
          assert any(x.startswith('shape=') for x in reasons)

          # New current official products are part of the managed master.
          by_slug={x['slug']:x for x in doc['products']}
          assert by_slug['plantlogic-30l-round-parallel-u-grooves-1308305']['product_no']=='1308305'
          assert len(by_slug['plantlogic-40l-square-u-grooves-side-holes-13090400-13090440']['skus'])==2

          from pathlib import Path
          media_apply=Path('backend/tools_apply_plantlogic_official_media_20260918.py').read_text(encoding='utf-8')
          assert 'product_number_verified' in media_apply
          assert 'identity_match' in media_apply
          assert 'score' in media_apply
          assert '_snapshot_tables()' in media_apply
          assert 'commerce_map changed during Plantlogic media apply' in media_apply
          assert 'pcv3.put' in media_apply
          assert 'UPDATE sku_commerce' not in media_apply
          assert 'INSERT INTO sku_commerce' not in media_apply
          assert 'DELETE FROM sku_commerce' not in media_apply

          print('PLANTLOGIC OFFICIAL MEDIA COLLECTOR CONTRACT: PASS')
          PY
