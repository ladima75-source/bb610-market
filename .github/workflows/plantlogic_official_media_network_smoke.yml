name: Plantlogic official media network smoke

on:
  push:
    branches: [main]
    paths:
      - 'data/product_content/plantlogic_pots_v1_20260918.json'
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'backend/tools_apply_plantlogic_official_media_20260918.py'
      - '.github/workflows/plantlogic_official_media_network_smoke.yml'
  workflow_dispatch:

jobs:
  official-media-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve every official Plantlogic primary image
        run: |
          python - <<'PY'
          from backend.tools_apply_plantlogic_official_media_20260918 import choose_primary
          from backend.tools_collect_plantlogic_official_media_20260918 import (
              EXPECTED_PRODUCTS,
              EXPECTED_SKUS,
              load_master,
          )

          doc=load_master()
          assert EXPECTED_PRODUCTS==34
          assert EXPECTED_SKUS==37
          assert len(doc['products'])==34
          assert sum(len(x.get('skus') or []) for x in doc['products'])==37

          failures=[]
          resolved=[]
          for i,spec in enumerate(doc['products'],1):
              slug=str(spec['slug'])
              try:
                  row=choose_primary(spec)
                  assert row['product_numbers']
                  assert len(row['bytes'])>=12000
                  assert row['kind'] in {'jpg','jpeg','png','webp','avif'}
                  resolved.append(row)
                  print(
                      f"{i:02d}/34 PASS | {slug} | "
                      f"score={row['candidate'].get('score')} | "
                      f"bytes={len(row['bytes'])} | {row['resolved_url']}"
                  )
              except Exception as exc:
                  failures.append((slug,str(exc)))
                  print(f"{i:02d}/34 FAIL | {slug} | {exc}")

          print()
          print(f"OFFICIAL MEDIA RESOLVED: {len(resolved)}/34")
          print(f"FAILURES: {len(failures)}")
          if failures:
              for slug,error in failures:
                  print("FAIL:",slug,"|",error)
              raise SystemExit(2)
          print("PLANTLOGIC OFFICIAL MEDIA NETWORK: PASS")
          PY
