name: Plantlogic official media network smoke

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'backend/tools_collect_plantlogic_official_media_20260918.py'
      - 'tools/build_plantlogic_v2_media.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - '.github/workflows/plantlogic_official_media_network_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-network:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Rebuild from exact official sources
        run: |
          set -euo pipefail
          python tools/build_plantlogic_v2_media.py
          python tools/audit_plantlogic_v2_final.py --require-media
