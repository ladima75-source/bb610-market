name: Plantlogic pot PDP CI

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'data/product_content/plantlogic_v2_media_manifest_20260928.json'
      - 'data/product_content/plantlogic_v2_media_audit_20260928.json'
      - 'assets/img/v5/media/**'
      - 'tools/audit_plantlogic_v2_final.py'
      - 'js/product.js'
      - 'js/product-pot.js'
      - 'js/data-source.js'
      - 'product.html'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  pull_request:
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'data/product_content/plantlogic_v2_media_manifest_20260928.json'
      - 'data/product_content/plantlogic_v2_media_audit_20260928.json'
      - 'tools/audit_plantlogic_v2_final.py'
      - 'js/product.js'
      - 'js/product-pot.js'
      - 'js/data-source.js'
      - 'product.html'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdp-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and full V2 contract
        run: |
          set -euo pipefail
          node --check js/product.js
          node --check js/product-pot.js
          node --check js/data-source.js
          python tools/audit_plantlogic_v2_final.py --require-media

      - name: Required storefront PDP cards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          spec=json.loads(Path('data/product_content/plantlogic_v2_final_20260928.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('data/product_content/plantlogic_v2_media_audit_20260928.json').read_text(encoding='utf-8'))
          by={x['canonical_product_id']:x for x in spec['canonical_products']}
          media={x['canonical_product_id']:x for x in audit['products']}
          expected={
            'plantlogic-blueberry-zephyr-v2-25l-1301144':('containers','blueberry'),
            'plantlogic-blueberry-zephyr-v2-30l-1301153':('containers','blueberry'),
            'plantlogic-blueberry-zephyr-v2-40l-1301143':('containers','blueberry'),
            'plantlogic-blueberry-round-30l-u-grooves-1308303':('containers','blueberry'),
            'plantlogic-10l-drainage-1307110':('containers','rubus'),
            'plantlogic-4-7l-square-cold-storage-13050040':('containers','rubus'),
            'plantlogic-7l-square-cold-storage-1305071':('containers','rubus'),
            'plantlogic-rivus-slab-base':('accessories','vegetable'),
            'plantlogic-rivus-end-cap':('accessories','vegetable'),
            'plantlogic-9l-strawberry-trough-truss-1305209':('strawberry','strawberry'),
            'plantlogic-blueberry-square-40l-u-grooves-side-holes-16mm-13090400':('containers','blueberry'),
            'plantlogic-blueberry-square-40l-u-grooves-side-holes-20mm-13090440':('containers','blueberry'),
          }
          for pid,(category,section) in expected.items():
              p=by[pid]
              assert p['title'].strip()
              assert p['technical_category_id']==category, (pid,p['technical_category_id'])
              assert p['plantlogic_section']==section, (pid,p['plantlogic_section'])
              assert p['skus'], pid
              assert media[pid]['gallery_count']>=1, (pid,media[pid]['gallery_count'])
          assert '16 мм' in by['plantlogic-blueberry-square-40l-u-grooves-side-holes-16mm-13090400']['title']
          assert '20 мм' in by['plantlogic-blueberry-square-40l-u-grooves-side-holes-20mm-13090440']['title']
          print('PLANTLOGIC V2 PDP TITLE/SKU/CATEGORY/GALLERY: PASS')
          PY

      - name: Gallery dedupe behavior
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('js/product-pot.js','utf8');
          const sandbox={window:{},document:{},location:{},BB610:{}};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          const fn=sandbox.window.BB610_POT_PDP.uniqueMedia;
          const got=fn([
            '/assets/img/v5/media/a.jpg',
            'https://api.market.bb610.com.ua/assets/img/v5/media/a.jpg?v=1',
            '/assets/img/v5/media/b.jpg',
            '/assets/img/v5/media/b.jpg',
            ''
          ]);
          if(JSON.stringify(got)!==JSON.stringify(['/assets/img/v5/media/a.jpg','/assets/img/v5/media/b.jpg'])) throw new Error(JSON.stringify(got));
          console.log('PLANTLOGIC V2 GALLERY DEDUPE: PASS');
          JS
