name: Plantlogic pot PDP CI

on:
  push:
    branches: [main]
    paths:
      - 'product.html'
      - 'js/product.js'
      - 'js/app.js'
      - 'catalog.html'
      - 'js/product-pot.js'
      - 'css/product-pot.css'
      - 'backend/services/product_cards_v3.py'
      - 'data/product_cards_v3/product_card_v3.schema.json'
      - 'backend/services/product_cards_v3_runtime.py'
      - 'backend/services/product_cards_v3_facets.py'
      - 'backend/update_plantlogic_blueberry_pots_v3_20260919.py'
      - 'backend/update_plantlogic_blueberry_pots_r2_20260919.py'
      - 'backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_20260919.py'
      - 'data/product_content/plantlogic_blueberry_pots_v2_20260919.json'
      - 'data/product_content/plantlogic_blueberry_pots_r2_20260919.json'
      - 'tools/build_plantlogic_blueberry_content_assets.py'
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  pull_request:
    paths:
      - 'product.html'
      - 'js/product.js'
      - 'js/app.js'
      - 'catalog.html'
      - 'js/product-pot.js'
      - 'css/product-pot.css'
      - 'backend/services/product_cards_v3.py'
      - 'data/product_cards_v3/product_card_v3.schema.json'
      - 'backend/services/product_cards_v3_runtime.py'
      - 'backend/services/product_cards_v3_facets.py'
      - 'backend/update_plantlogic_blueberry_pots_v3_20260919.py'
      - 'backend/update_plantlogic_blueberry_pots_r2_20260919.py'
      - 'backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_20260919.py'
      - 'data/product_content/plantlogic_blueberry_pots_v2_20260919.json'
      - 'data/product_content/plantlogic_blueberry_pots_r2_20260919.json'
      - 'tools/build_plantlogic_blueberry_content_assets.py'
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check js/product.js
          node --check js/app.js
          node --check js/product-pot.js
          python -m py_compile backend/services/product_cards_v3.py backend/services/product_cards_v3_runtime.py backend/services/product_cards_v3_facets.py backend/update_plantlogic_blueberry_pots_v3_20260919.py backend/update_plantlogic_blueberry_pots_r2_20260919.py backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py backend/tools_verify_plantlogic_blueberry_architecture_20260919.py backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py backend/tools_apply_plantlogic_official_gallery_20260919.py

      - name: Dedicated PDP contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html=Path('product.html').read_text(encoding='utf-8')
          product=Path('js/product.js').read_text(encoding='utf-8')
          pot=Path('js/product-pot.js').read_text(encoding='utf-8')
          css=Path('css/product-pot.css').read_text(encoding='utf-8')
          facets=Path('backend/services/product_cards_v3_facets.py').read_text(encoding='utf-8')

          assert 'css/product-pot.css?v=20260919-pot-pdp-5' in html
          assert 'js/product-pot.js?v=20260919-pot-pdp-5' in html
          assert html.index('js/product-pot.js') < html.index('js/product.js?v=20260919-pot-pdp-1')
          assert 'BB610_POT_PDP?.matches(p)' in product
          assert 'BB610_POT_PDP.render' in product

          assert "p.category==='containers'" in pot
          assert "norm(p.brand)==='plantlogic'" in pot
          assert 'function uniqueMedia(items)' in pot
          assert 'selectedSku?.image' in pot
          assert 'selectedSku?.gallery' in pot
          assert 'function mediaKey(value)' in pot
          assert 'pot-model-options' in pot
          assert 'data-pot-model' in pot
          assert 'pot-color-options' in pot
          assert 'manufacturer_product_no' in pot
          assert "'gallery': sku_gallery" in facets
          assert 'pot-main-stage' in pot
          assert 'pot-benefit-grid' in pot
          assert 'pot-spec-table' in pot
          assert 'pot-related-grid' in pot
          assert 'Відкрити сайт виробника' in pot

          assert '.pot-main-stage{height:560px' in css
          assert 'overflow:hidden' in css
          assert 'object-fit:contain!important' in css
          assert '.pot-thumbs' in css
          assert '.pot-gallery-count' in css
          assert '.pot-model-option' in css
          assert '.pot-family-layout' in css
          assert '.pot-explainer-layout' in css
          assert '.pot-garden-guide' in css

          assert 'function renderFamilyOverview(product)' in pot
          assert 'function renderTechnologyExplainer(product)' in pot
          assert 'function renderGardenGuide(product)' in pot
          assert 'family_overview' in pot
          assert 'technology_explainer' in pot
          assert 'garden_guide' in pot

          assert "patch['benefits']" in facets
          assert "patch['how_it_works']" in facets
          assert "patch['characteristics']" in facets
          assert "'benefits': deepcopy(content.get('benefits') or [])" in facets

          print('PLANTLOGIC DEDICATED PDP CONTRACT: PASS')
          PY

      - name: Reversible blueberry architecture R2
        run: |
          python backend/update_plantlogic_pots_v3_20260918.py --apply
          python backend/update_plantlogic_blueberry_pots_v3_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_20260919.py

          python backend/update_plantlogic_blueberry_pots_r2_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py

          python backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_20260919.py

          python backend/update_plantlogic_blueberry_pots_r2_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py

      - name: Blueberry educational content contract
        run: |
          python - <<'PY'
          from backend.services import product_cards_v3 as pcv3
          from backend.services.product_cards_v3_facets import market_test_projection

          ids = [
              'prd_pl_bb_round',
              'prd_pl_bb_round_short_legs',
              'prd_pl_bb_square',
              'prd_pl_bb_round_u',
              'prd_pl_bb_square_u',
              'prd_pl_bb_zephyr_v2',
          ]
          educational = {
              '/assets/plantlogic/blueberry-family-standard.jpg',
              '/assets/plantlogic/blueberry-family-u-groove.jpg',
              '/assets/plantlogic/blueberry-root-zone.png',
          }
          for pid in ids:
              card = pcv3.get(pid)
              assert card and card['enabled'] is True
              content = card['content']
              assert isinstance(content.get('garden_guide'), dict)
              assert content['garden_guide']['url'] == 'https://garden.bb610.com.ua'
              if pid != 'prd_pl_bb_zephyr_v2':
                  assert isinstance(content.get('family_overview'), dict)
                  assert isinstance(content.get('technology_explainer'), dict)
                  codes = [x['code'] for x in content['technology_explainer']['items']]
                  if pid in {'prd_pl_bb_round_u','prd_pl_bb_square_u'}:
                      assert codes == ['A','B','C','D'], (pid,codes)
                  else:
                      assert codes == ['B','C','D'], (pid,codes)

              for media in (card.get('sku_media') or {}).get('media') or []:
                  assert media.get('path') not in educational
              for sku in (card.get('sku_media') or {}).get('skus') or []:
                  assert all(str(mid) for mid in sku.get('gallery_media_ids') or [])

          projection = market_test_projection()
          rows = [x for x in projection['products'] if x.get('v3_product_id') in ids]
          assert len(rows) == 6
          assert all(isinstance(x.get('garden_guide'), dict) for x in rows)
          assert all('blueberry-family-' not in str(x.get('gallery') or '') for x in rows)
          assert all('blueberry-root-zone' not in str(x.get('gallery') or '') for x in rows)
          print('PLANTLOGIC EDUCATIONAL CONTENT ISOLATION: PASS')
          PY

      - name: Official gallery safety contract
        run: |
          python - <<'PY'
          from backend.tools_apply_plantlogic_official_gallery_20260919 import safe_gallery_candidate

          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 120,
              'reasons': ['product_no=1303025'],
          })
          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 190,
              'reasons': ['volume_match','shape=round'],
          })
          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 130,
              'reasons': ['features=zephyr'],
          })
          assert not safe_gallery_candidate({
              'identity_match': True,
              'score': 120,
              'reasons': ['volume_match'],
          })
          assert not safe_gallery_candidate({
              'identity_match': False,
              'score': 300,
              'reasons': ['product_no=1303025'],
          })
          print('OFFICIAL PLANTLOGIC GALLERY SAFETY: PASS')
          PY
      - name: Gallery dedupe behavior
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('js/product-pot.js','utf8');
          const sandbox={window:{},document:{},location:{},BB610:{}};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          const fn=sandbox.window.BB610_POT_PDP.uniqueMedia;
          const got=fn([
            '/media/products/a.jpg',
            'https://api.market.bb610.com.ua/media/products/a.jpg?v=1',
            '/media/products/b.jpg',
            '/media/products/b.jpg',
            ''
          ]);
          if(JSON.stringify(got)!==JSON.stringify(['/media/products/a.jpg','/media/products/b.jpg'])) throw new Error(JSON.stringify(got));
          console.log('PLANTLOGIC GALLERY DEDUPE: PASS');
          JS
