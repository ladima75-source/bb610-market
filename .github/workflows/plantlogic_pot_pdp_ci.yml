name: Plantlogic pot PDP CI

on:
  push:
    branches: [main]
    paths:
      - 'product.html'
      - 'js/product.js'
      - 'js/app.js'
      - 'catalog.html'
      - 'js/product-pot.js'
      - 'css/product-pot.css'
      - 'backend/services/product_cards_v3.py'
      - 'backend/services/product_cards_v3_runtime.py'
      - 'backend/services/product_cards_v3_facets.py'
      - 'backend/update_plantlogic_blueberry_pots_v3_20260919.py'
      - 'data/product_content/plantlogic_blueberry_pots_v2_20260919.json'
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  pull_request:
    paths:
      - 'product.html'
      - 'js/product.js'
      - 'js/app.js'
      - 'catalog.html'
      - 'js/product-pot.js'
      - 'css/product-pot.css'
      - 'backend/services/product_cards_v3.py'
      - 'backend/services/product_cards_v3_runtime.py'
      - 'backend/services/product_cards_v3_facets.py'
      - 'backend/update_plantlogic_blueberry_pots_v3_20260919.py'
      - 'data/product_content/plantlogic_blueberry_pots_v2_20260919.json'
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check js/product.js
          node --check js/app.js
          node --check js/product-pot.js
          python -m py_compile backend/services/product_cards_v3.py backend/services/product_cards_v3_runtime.py backend/services/product_cards_v3_facets.py backend/update_plantlogic_blueberry_pots_v3_20260919.py backend/tools_apply_plantlogic_official_gallery_20260919.py

      - name: Dedicated PDP contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html=Path('product.html').read_text(encoding='utf-8')
          product=Path('js/product.js').read_text(encoding='utf-8')
          pot=Path('js/product-pot.js').read_text(encoding='utf-8')
          css=Path('css/product-pot.css').read_text(encoding='utf-8')
          facets=Path('backend/services/product_cards_v3_facets.py').read_text(encoding='utf-8')

          assert 'css/product-pot.css?v=20260919-pot-pdp-3' in html
          assert 'js/product-pot.js?v=20260919-pot-pdp-3' in html
          assert html.index('js/product-pot.js') < html.index('js/product.js?v=20260919-pot-pdp-1')
          assert 'BB610_POT_PDP?.matches(p)' in product
          assert 'BB610_POT_PDP.render' in product

          assert "p.category==='containers'" in pot
          assert "norm(p.brand)==='plantlogic'" in pot
          assert 'function uniqueMedia(items)' in pot
          assert 'selectedSku?.image' in pot
          assert 'selectedSku?.gallery' in pot
          assert 'function mediaKey(value)' in pot
          assert 'pot-volume-options' in pot
          assert 'pot-execution-options' in pot
          assert 'pot-color-options' in pot
          assert 'manufacturer_product_no' in pot
          assert "'gallery': sku_gallery" in facets
          assert 'pot-main-stage' in pot
          assert 'pot-benefit-grid' in pot
          assert 'pot-spec-table' in pot
          assert 'pot-related-grid' in pot
          assert 'Відкрити сайт виробника' in pot

          assert '.pot-main-stage{height:560px' in css
          assert 'overflow:hidden' in css
          assert 'object-fit:contain!important' in css
          assert '.pot-thumbs' in css
          assert '.pot-gallery-count' in css

          assert "patch['benefits']" in facets
          assert "patch['how_it_works']" in facets
          assert "patch['characteristics']" in facets
          assert "'benefits': deepcopy(content.get('benefits') or [])" in facets

          print('PLANTLOGIC DEDICATED PDP CONTRACT: PASS')
          PY

      - name: Five-card blueberry architecture
        run: |
          python backend/update_plantlogic_pots_v3_20260918.py --apply
          python backend/update_plantlogic_blueberry_pots_v3_20260919.py --apply
          python - <<'PY'
          from backend.services import product_cards_v3 as pcv3
          from backend.services.product_cards_v3_facets import market_test_projection

          expected = {
              'prd_pl_bb_round': 15,
              'prd_pl_bb_square': 9,
              'prd_pl_bb_round_u': 12,
              'prd_pl_bb_square_u': 6,
              'prd_pl_bb_zephyr_v2': 6,
          }
          numbers = {
              '1308020','1303025','1308025','1308031','1308040',
              '1309020','1309025','1309030',
              '1308303','1308305','1308035','13080410',
              '1309026','1309035',
              '1301144','1301153','1301143',
          }
          seen_numbers=set()
          seen_codes=set()
          for pid,count in expected.items():
              card=pcv3.get(pid)
              assert card and card['enabled'] is True, pid
              assert 'plantlogic' not in card['content']['title'].lower()
              skus=card['sku_media']['skus']
              assert len(skus)==count, (pid,len(skus))
              for sku in skus:
                  a=sku.get('attributes') or {}
                  assert a.get('volume_label')
                  assert a.get('execution_code')
                  assert a.get('color_code') in {'black','white','terracotta'}
                  assert a.get('manufacturer_product_no') in numbers
                  seen_numbers.add(a['manufacturer_product_no'])
                  assert sku['sku_code'] not in seen_codes
                  seen_codes.add(sku['sku_code'])
          assert seen_numbers==numbers
          assert len(seen_codes)==48

          projection=market_test_projection()
          products=[x for x in projection['products'] if x.get('v3_product_id') in expected]
          skus=[x for x in projection['skus'] if x.get('product_id') in {p['id'] for p in products}]
          assert len(products)==5, len(products)
          assert len(skus)==48, len(skus)
          assert all(x.get('price') is None for x in skus)
          assert all(x.get('availability')=='backorder' for x in skus)
          assert all(x.get('price_request') is True for x in skus)
          assert all((x.get('attributes') or {}).get('manufacturer_product_no') for x in skus)
          print('PLANTLOGIC BLUEBERRY 5 PRODUCT / 17 MODEL / 48 SKU: PASS')
          PY

      - name: Official gallery safety contract
        run: |
          python - <<'PY'
          from backend.tools_apply_plantlogic_official_gallery_20260919 import safe_gallery_candidate

          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 120,
              'reasons': ['product_no=1303025'],
          })
          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 190,
              'reasons': ['volume_match','shape=round'],
          })
          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 130,
              'reasons': ['features=zephyr'],
          })
          assert not safe_gallery_candidate({
              'identity_match': True,
              'score': 120,
              'reasons': ['volume_match'],
          })
          assert not safe_gallery_candidate({
              'identity_match': False,
              'score': 300,
              'reasons': ['product_no=1303025'],
          })
          print('OFFICIAL PLANTLOGIC GALLERY SAFETY: PASS')
          PY
      - name: Gallery dedupe behavior
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('js/product-pot.js','utf8');
          const sandbox={window:{},document:{},location:{},BB610:{}};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          const fn=sandbox.window.BB610_POT_PDP.uniqueMedia;
          const got=fn([
            '/media/products/a.jpg',
            'https://api.market.bb610.com.ua/media/products/a.jpg?v=1',
            '/media/products/b.jpg',
            '/media/products/b.jpg',
            ''
          ]);
          if(JSON.stringify(got)!==JSON.stringify(['/media/products/a.jpg','/media/products/b.jpg'])) throw new Error(JSON.stringify(got));
          console.log('PLANTLOGIC GALLERY DEDUPE: PASS');
          JS
