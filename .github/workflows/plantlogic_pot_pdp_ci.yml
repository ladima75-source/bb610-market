name: Plantlogic pot PDP CI

on:
  push:
    branches: [main]
    paths:
      - 'product.html'
      - 'js/product.js'
      - 'js/app.js'
      - 'catalog.html'
      - 'js/product-pot.js'
      - 'css/product-pot.css'
      - 'backend/services/product_cards_v3.py'
      - 'data/product_cards_v3/product_card_v3.schema.json'
      - 'backend/services/product_cards_v3_runtime.py'
      - 'backend/services/product_cards_v3_facets.py'
      - 'backend/update_plantlogic_blueberry_pots_v3_20260919.py'
      - 'backend/update_plantlogic_blueberry_pots_r2_20260919.py'
      - 'backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_20260919.py'
      - 'data/product_content/plantlogic_blueberry_pots_v2_20260919.json'
      - 'data/product_content/plantlogic_blueberry_pots_r2_20260919.json'
      - 'tools/build_plantlogic_blueberry_content_assets.py'
      - 'assets/plantlogic/blueberry-family-standard.jpg'
      - 'assets/plantlogic/blueberry-family-u-groove.jpg'
      - 'assets/plantlogic/blueberry-root-zone.png'
      - 'assets/plantlogic/blueberry-root-zone-standard.jpg'
      - '.github/workflows/plantlogic_blueberry_content_assets.yml'
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  pull_request:
    paths:
      - 'product.html'
      - 'js/product.js'
      - 'js/app.js'
      - 'catalog.html'
      - 'js/product-pot.js'
      - 'css/product-pot.css'
      - 'backend/services/product_cards_v3.py'
      - 'data/product_cards_v3/product_card_v3.schema.json'
      - 'backend/services/product_cards_v3_runtime.py'
      - 'backend/services/product_cards_v3_facets.py'
      - 'backend/update_plantlogic_blueberry_pots_v3_20260919.py'
      - 'backend/update_plantlogic_blueberry_pots_r2_20260919.py'
      - 'backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py'
      - 'backend/tools_verify_plantlogic_blueberry_architecture_20260919.py'
      - 'data/product_content/plantlogic_blueberry_pots_v2_20260919.json'
      - 'data/product_content/plantlogic_blueberry_pots_r2_20260919.json'
      - 'tools/build_plantlogic_blueberry_content_assets.py'
      - 'assets/plantlogic/blueberry-family-standard.jpg'
      - 'assets/plantlogic/blueberry-family-u-groove.jpg'
      - 'assets/plantlogic/blueberry-root-zone.png'
      - 'assets/plantlogic/blueberry-root-zone-standard.jpg'
      - '.github/workflows/plantlogic_blueberry_content_assets.yml'
      - 'backend/tools_apply_plantlogic_official_gallery_20260919.py'
      - '.github/workflows/plantlogic_pot_pdp_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check js/product.js
          node --check js/app.js
          node --check js/product-pot.js
          python -m py_compile backend/services/product_cards_v3.py backend/services/product_cards_v3_runtime.py backend/services/product_cards_v3_facets.py backend/update_plantlogic_blueberry_pots_v3_20260919.py backend/update_plantlogic_blueberry_pots_r2_20260919.py backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py backend/tools_verify_plantlogic_blueberry_architecture_20260919.py backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py backend/tools_apply_plantlogic_official_gallery_20260919.py tools/build_plantlogic_blueberry_content_assets.py

      - name: Dedicated PDP contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html=Path('product.html').read_text(encoding='utf-8')
          product=Path('js/product.js').read_text(encoding='utf-8')
          pot=Path('js/product-pot.js').read_text(encoding='utf-8')
          css=Path('css/product-pot.css').read_text(encoding='utf-8')
          facets=Path('backend/services/product_cards_v3_facets.py').read_text(encoding='utf-8')

          assert 'css/product-pot.css?v=20260919-pot-pdp-13' in html
          assert 'js/product-pot.js?v=20260919-pot-pdp-11' in html
          assert html.index('js/product-pot.js') < html.index('js/product.js?v=20260919-pot-pdp-1')
          assert 'BB610_POT_PDP?.matches(p)' in product
          assert 'BB610_POT_PDP.render' in product

          assert "p.category==='containers'" in pot
          assert "norm(p.brand)==='plantlogic'" in pot
          assert 'function uniqueMedia(items)' in pot
          assert 'function potRecolorClass(sku)' in pot
          assert 'pot-filter-terra-black' in pot
          assert 'pot-filter-black-white' in pot
          assert 'pot-filter-black-terra' in pot
          assert '.pot-recolor-black-white' in css
          assert '.pot-recolor-black-terra' in css
          assert '.pot-recolor-terra-black' in css
          assert 'selectedSku?.image' in pot
          assert 'selectedSku?.gallery' in pot
          assert 'function mediaKey(value)' in pot
          assert 'if(exact.length||hasStructured)return exact' in pot
          assert 'Фото обраної моделі готується' in pot
          assert '.pot-gallery-empty' in css
          print('PLANTLOGIC structured gallery isolation: PASS')
          assert 'pot-model-options' in pot
          assert 'data-pot-model' in pot
          assert 'pot-color-options' in pot
          assert 'manufacturer_product_no' in pot
          assert "'gallery': sku_gallery" in facets
          assert 'pot-main-stage' in pot
          assert 'pot-benefit-grid' in pot
          assert 'pot-spec-table' in pot
          assert 'pot-related-grid' in pot
          assert 'Відкрити сайт виробника' in pot

          assert '.pot-main-stage{height:560px' in css
          assert 'overflow:hidden' in css
          assert 'object-fit:contain!important' in css
          assert '.pot-thumbs' in css
          assert '.pot-gallery-count' in css
          assert '.pot-model-option' in css
          assert '.pot-family-figure' in css
          assert '.pot-explainer-layout' in css
          assert '.pot-garden-guide' in css
          assert '.pot-diagram-marker' in css
          assert '.pot-visual-section' in css
          assert '.pot-model-showcase-grid' in css
          assert 'Desktop fold tuning' in css
          assert 'max-width:88%!important' in css
          assert 'object-position:center center!important' in css
          assert 'grid-template-columns:repeat(4,minmax(0,1fr))' in css
          assert 'min-height:590px' in css
          assert 'box-shadow:0 18px 42px' in css

          assert 'function renderFamilyOverview(product)' in pot
          assert 'function renderModelShowcase(product)' in pot
          assert 'pot-model-showcase-grid' in pot
          assert 'data-pot-content-image' in pot
          assert 'Дренаж, вентиляція та робота конструкції' not in pot
          assert 'function renderTechnologyExplainer(product)' in pot
          assert 'pot-diagram-marker' in pot
          assert 'function renderGardenGuide(product)' in pot
          assert 'family_overview' in pot
          assert 'technology_explainer' in pot
          assert 'garden_guide' in pot

          assert "patch['benefits']" in facets
          assert "patch['how_it_works']" in facets
          assert "patch['characteristics']" in facets
          assert "'benefits': deepcopy(content.get('benefits') or [])" in facets

          print('PLANTLOGIC DEDICATED PDP CONTRACT: PASS')
          PY

      - name: Reversible blueberry architecture R2
        run: |
          python backend/update_plantlogic_pots_v3_20260918.py --apply
          python backend/update_plantlogic_blueberry_pots_v3_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_20260919.py

          python backend/update_plantlogic_blueberry_pots_r2_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py

          python backend/rollback_plantlogic_blueberry_pots_to_5card_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_20260919.py

          python backend/update_plantlogic_blueberry_pots_r2_20260919.py --apply
          python backend/tools_verify_plantlogic_blueberry_architecture_r2_20260919.py

      - name: Blueberry educational content contract
        run: |
          python - <<'PY'
          from backend.services import product_cards_v3 as pcv3
          from backend.services.product_cards_v3_facets import market_test_projection

          ids = [
              'prd_pl_bb_round',
              'prd_pl_bb_round_short_legs',
              'prd_pl_bb_square',
              'prd_pl_bb_round_u',
              'prd_pl_bb_square_u',
              'prd_pl_bb_zephyr_v2',
          ]
          educational = {
              '/assets/plantlogic/blueberry-family-standard.jpg',
              '/assets/plantlogic/blueberry-family-u-groove.jpg',
              '/assets/plantlogic/blueberry-root-zone.png',
              '/assets/plantlogic/blueberry-root-zone-standard.jpg',
          }
          for pid in ids:
              card = pcv3.get(pid)
              assert card and card['enabled'] is True
              content = card['content']
              assert isinstance(content.get('garden_guide'), dict)
              assert content['garden_guide']['url'] == 'https://garden.bb610.com.ua'
              if pid != 'prd_pl_bb_zephyr_v2':
                  if pid in {'prd_pl_bb_round','prd_pl_bb_round_short_legs','prd_pl_bb_square','prd_pl_bb_round_u','prd_pl_bb_square_u'}:
                      assert content.get('family_overview') is None
                      assert isinstance(content.get('model_showcase'), dict)
                  else:
                      assert isinstance(content.get('family_overview'), dict)
                  assert isinstance(content.get('technology_explainer'), dict)
                  codes = [x['code'] for x in content['technology_explainer']['items']]
                  if pid in {'prd_pl_bb_round_u','prd_pl_bb_square_u'}:
                      assert codes == ['A','B','C','D'], (pid,codes)
                  else:
                      assert codes == ['B','C','D'], (pid,codes)
                  image = content['technology_explainer']['image']
                  if pid in {'prd_pl_bb_round_u','prd_pl_bb_square_u'}:
                      assert image.endswith('blueberry-root-zone.png'), (pid,image)
                  else:
                      assert image.endswith('blueberry-root-zone-standard.jpg'), (pid,image)

              for media in (card.get('sku_media') or {}).get('media') or []:
                  assert media.get('path') not in educational
              for sku in (card.get('sku_media') or {}).get('skus') or []:
                  assert all(str(mid) for mid in sku.get('gallery_media_ids') or [])

          for path in [
              'assets/plantlogic/blueberry-family-standard.jpg',
              'assets/plantlogic/blueberry-family-u-groove.jpg',
              'assets/plantlogic/blueberry-root-zone.png',
              'assets/plantlogic/blueberry-root-zone-standard.jpg',
          ]:
              p = __import__('pathlib').Path(path)
              assert p.is_file() and p.stat().st_size > 10000, path

          projection = market_test_projection()
          rows = [x for x in projection['products'] if x.get('v3_product_id') in ids]
          assert len(rows) == 6
          assert all(isinstance(x.get('garden_guide'), dict) for x in rows)
          assert all('blueberry-family-' not in str(x.get('gallery') or '') for x in rows)
          assert all('blueberry-root-zone' not in str(x.get('gallery') or '') for x in rows)
          round_card = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_round')
          media = (round_card.get('sku_media') or {}).get('media') or []
          paths = [str(x.get('path') or '') for x in media]
          assert any('20-Liter-Round-Pot_Item_1308020.jpg' in x for x in paths)
          assert any('8025_4.jpg' in x for x in paths)
          assert any('30-Liter-Round-Pot-with-V-ribs_Item_1308031.jpg' in x for x in paths)
          assert any('40-Liter-Round-Pot_Item_1308040-1.jpg' in x for x in paths)
          assert isinstance(round_card['content'].get('model_showcase'), dict)
          assert len(round_card['content']['model_showcase']['items']) == 4
          short_card = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_round_short_legs')
          short_paths = [str(x.get('path') or '') for x in (short_card.get('sku_media') or {}).get('media') or []]
          assert any('3025_1.jpg' in x for x in short_paths)
          assert isinstance(short_card['content'].get('model_showcase'), dict)
          assert len(short_card['content']['model_showcase']['items']) == 1
          print('SHORT LEGS OFFICIAL MEDIA: PASS')
          square_card = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_square')
          square_paths = [str(x.get('path') or '') for x in (square_card.get('sku_media') or {}).get('media') or []]
          assert any('20-Liter-Square-Pot_Item_1309020.jpg' in x for x in square_paths)
          assert any('25L-SQ-1309025-FRONTAL.jpg' in x for x in square_paths)
          assert any('30-Liter-Square-Pot_Item_1309030-1.jpg' in x for x in square_paths)
          assert isinstance(square_card['content'].get('model_showcase'), dict)
          assert len(square_card['content']['model_showcase']['items']) == 3
          print('SQUARE CARD OFFICIAL MEDIA: PASS')
          round_u = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_round_u')
          round_u_paths = [str(x.get('path') or '') for x in (round_u.get('sku_media') or {}).get('media') or []]
          assert any('1308303-1.jpg' in x for x in round_u_paths)
          assert any('1308305-FRONT-1.jpg' in x for x in round_u_paths)
          assert any('Maceta-35-litros-redonda-para-blueberries.jpg' in x for x in round_u_paths)
          assert any('40-Liter-Round-Pot-with-U-grooves_Item_1308041.jpg' in x for x in round_u_paths)
          assert isinstance(round_u['content'].get('model_showcase'), dict)
          assert len(round_u['content']['model_showcase']['items']) == 4

          square_u = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_square_u')
          square_u_paths = [str(x.get('path') or '') for x in (square_u.get('sku_media') or {}).get('media') or []]
          assert any('1309026.jpg' in x for x in square_u_paths)
          assert any('13090350_frente.jpg' in x for x in square_u_paths)
          assert isinstance(square_u['content'].get('model_showcase'), dict)
          assert len(square_u['content']['model_showcase']['items']) == 2

          zephyr = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_zephyr_v2')
          zephyr_paths = [str(x.get('path') or '') for x in (zephyr.get('sku_media') or {}).get('media') or []]
          assert any('ZEPHYR-V2-1301144-FRONTAL-1.jpg' in x for x in zephyr_paths)
          round_u_codes = {str(x.get('sku_code') or '') for x in (round_u.get('sku_media') or {}).get('skus') or []}
          square_u_codes = {str(x.get('sku_code') or '') for x in (square_u.get('sku_media') or {}).get('skus') or []}
          assert any('13080350' in x for x in round_u_codes)
          assert any('1308041' in x for x in round_u_codes)
          assert any('13090350' in x for x in square_u_codes)
          assert not any('1308035-' in x or '13080410' in x for x in round_u_codes)
          assert not any('1309035-' in x for x in square_u_codes)
          u30 = next(x for x in (round_u.get('sku_media') or {}).get('skus') or [] if x.get('sku_code') == 'PL-BB-1308303-BK')
          assert (u30.get('attributes') or {}).get('media_source_color') == 'terracotta'
          print('U-GROOVE COLOR SOURCE: PASS')
          u35 = next(x for x in (round_u.get('sku_media') or {}).get('skus') or [] if x.get('sku_code') == 'PL-BB-13080350-BK')
          assert (u35.get('attributes') or {}).get('media_source_color') == 'black'
          print('BLACK SOURCE COLOR: PASS')
          print('OFFICIAL U-GROOVE PRODUCT NUMBERS: PASS')
          print('REMAINING VERIFIED MODEL MEDIA: PASS')
          zephyr = __import__('backend.services.product_cards_v3', fromlist=['get']).get('prd_pl_bb_zephyr_v2')
          zskus = (zephyr.get('sku_media') or {}).get('skus') or []
          zmedia = {str(x.get('media_id') or ''): str(x.get('path') or '') for x in (zephyr.get('sku_media') or {}).get('media') or []}
          black = next(x for x in zskus if x.get('sku_code') == 'PL-BB-1301144-BK')
          white = next(x for x in zskus if x.get('sku_code') == 'PL-BB-1301144-WH')
          black_paths = [zmedia.get(black.get('primary_media_id'))] + [zmedia.get(x) for x in black.get('gallery_media_ids') or []]
          white_paths = [zmedia.get(white.get('primary_media_id'))] + [zmedia.get(x) for x in white.get('gallery_media_ids') or []]
          assert any('FRONTAL-2-2.jpg' in str(x) for x in black_paths)
          assert any('FRONTAL-1.jpg' in str(x) for x in white_paths)
          assert not any('FRONTAL-1.jpg' in str(x) or 'BASE.jpg' in str(x) for x in black_paths)
          assert not any('FRONTAL-2-2.jpg' in str(x) or 'FRONTAL-2-1.jpg' in str(x) or 'BASE-2.jpg' in str(x) or 'CENITAL-1.jpg' in str(x) for x in white_paths)
          print('ZEPHYR COLOR MEDIA: PASS')
          z30b = next(x for x in zskus if x.get('sku_code') == 'PL-BB-1301153-BK')
          z30w = next(x for x in zskus if x.get('sku_code') == 'PL-BB-1301153-WH')
          z40b = next(x for x in zskus if x.get('sku_code') == 'PL-BB-1301143-BK')
          z40w = next(x for x in zskus if x.get('sku_code') == 'PL-BB-1301143-WH')
          for row in (z30b,z30w,z40b,z40w):
              paths = [zmedia.get(row.get('primary_media_id'))] + [zmedia.get(x) for x in row.get('gallery_media_ids') or []]
              assert any('/assets/plantlogic/zephyr-v2-capacities.jpg' in str(x) for x in paths)
              assert any('/assets/plantlogic/zephyr-v2-greenhouse.jpg' in str(x) for x in paths)
              assert not any('1301144-FRONTAL' in str(x) for x in paths)
          print('ZEPHYR FALLBACK VISUALS: PASS')
          print('ROUND CARD OFFICIAL MEDIA: PASS')
          print('PLANTLOGIC EDUCATIONAL CONTENT ISOLATION: PASS')
          PY

      - name: Official gallery safety contract
        run: |
          python - <<'PY'
          from backend.tools_apply_plantlogic_official_gallery_20260919 import safe_gallery_candidate

          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 120,
              'reasons': ['product_no=1303025'],
          })
          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 190,
              'reasons': ['volume_match','shape=round'],
          })
          assert safe_gallery_candidate({
              'identity_match': True,
              'score': 130,
              'reasons': ['features=zephyr'],
          })
          assert not safe_gallery_candidate({
              'identity_match': True,
              'score': 120,
              'reasons': ['volume_match'],
          })
          assert not safe_gallery_candidate({
              'identity_match': False,
              'score': 300,
              'reasons': ['product_no=1303025'],
          })
          print('OFFICIAL PLANTLOGIC GALLERY SAFETY: PASS')
          PY
      - name: Gallery dedupe behavior
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('js/product-pot.js','utf8');
          const sandbox={window:{},document:{},location:{},BB610:{}};
          vm.createContext(sandbox);
          vm.runInContext(code,sandbox);
          const fn=sandbox.window.BB610_POT_PDP.uniqueMedia;
          const got=fn([
            '/media/products/a.jpg',
            'https://api.market.bb610.com.ua/media/products/a.jpg?v=1',
            '/media/products/b.jpg',
            '/media/products/b.jpg',
            ''
          ]);
          if(JSON.stringify(got)!==JSON.stringify(['/media/products/a.jpg','/media/products/b.jpg'])) throw new Error(JSON.stringify(got));
          console.log('PLANTLOGIC GALLERY DEDUPE: PASS');
          JS
