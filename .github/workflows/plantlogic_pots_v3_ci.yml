name: Plantlogic pots Product Card v3 CI

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'backend/services/plantlogic_v2_final.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - '.github/workflows/plantlogic_pots_v3_ci.yml'
  pull_request:
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'backend/services/plantlogic_v2_final.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - '.github/workflows/plantlogic_pots_v3_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical V2 structural contract
        run: |
          set -euo pipefail
          python -m py_compile backend/services/plantlogic_v2_final.py backend/services/product_master_v5_migrations.py tools/audit_plantlogic_v2_final.py
          python tools/audit_plantlogic_v2_final.py

      - name: V2 expected state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/product_content/plantlogic_v2_final_20260928.json').read_text(encoding='utf-8'))
          p=d['canonical_products']
          assert len(p)==78
          assert sum(len(x.get('skus') or []) for x in p)==133
          assert len(d['aliases'])==15
          assert {x['action'] for x in p}=={'KEEP','CREATE','SPLIT','RENAME'}
          counts={k:sum(x['action']==k for x in p) for k in ('KEEP','CREATE','SPLIT','RENAME')}
          assert counts=={'KEEP':31,'CREATE':26,'SPLIT':4,'RENAME':17}
          by={x['canonical_product_id']:x for x in p}
          assert [x['sku_id'] for x in by['plantlogic-rivus-slab-base']['skus']]==['PL-13020500','PL-13020502']
          assert [x['sku_id'] for x in by['plantlogic-rivus-end-cap']['skus']]==['PL-13020510','PL-13020512']
          assert '16 мм' in by['plantlogic-blueberry-square-40l-u-grooves-side-holes-16mm-13090400']['title']
          assert '20 мм' in by['plantlogic-blueberry-square-40l-u-grooves-side-holes-20mm-13090440']['title']
          print('PLANTLOGIC V2 PRODUCT STRUCTURE: PASS')
          PY
