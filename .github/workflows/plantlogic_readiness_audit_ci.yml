name: Plantlogic readiness audit CI

on:
  push:
    branches: [main, plantlogic-v2-work]
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'data/product_content/plantlogic_v2_media_manifest_20260928.json'
      - 'data/product_content/plantlogic_v2_media_audit_20260928.json'
      - 'assets/img/v5/media/**'
      - 'backend/services/plantlogic_v2_final.py'
      - 'backend/services/product_master_v5_migrations.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - '.github/workflows/plantlogic_readiness_audit_ci.yml'
  pull_request:
    paths:
      - 'data/product_content/plantlogic_v2_final_20260928.json'
      - 'data/product_content/plantlogic_v2_media_manifest_20260928.json'
      - 'data/product_content/plantlogic_v2_media_audit_20260928.json'
      - 'backend/services/plantlogic_v2_final.py'
      - 'tools/audit_plantlogic_v2_final.py'
      - '.github/workflows/plantlogic_readiness_audit_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full canonical readiness audit
        run: |
          set -euo pipefail
          python -m py_compile backend/services/plantlogic_v2_final.py backend/services/product_master_v5_migrations.py tools/audit_plantlogic_v2_final.py
          python tools/audit_plantlogic_v2_final.py --require-media
