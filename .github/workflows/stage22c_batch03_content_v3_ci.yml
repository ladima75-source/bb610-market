name: Stage22c batch03 content v3 CI

on:
  push:
    branches: [main]
    paths:
      - 'data/content_batches/stage22c_batch03_rows25_36.json'
      - 'data/product_content/stage22c_batch03_20260918.json'
      - 'backend/update_stage22c_batch03_content_v3_20260918.py'
      - 'backend/services/product_cards_v3.py'
      - '.github/workflows/stage22c_batch03_content_v3_ci.yml'
  pull_request:
    paths:
      - 'data/content_batches/stage22c_batch03_rows25_36.json'
      - 'data/product_content/stage22c_batch03_20260918.json'
      - 'backend/update_stage22c_batch03_content_v3_20260918.py'
      - 'backend/services/product_cards_v3.py'
      - '.github/workflows/stage22c_batch03_content_v3_ci.yml'

jobs:
  content-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile backend/update_stage22c_batch03_content_v3_20260918.py
      - name: Validate source transform and content-only overlay
        run: |
          python - <<'PY'
          from copy import deepcopy
          from backend import update_stage22c_batch03_content_v3_20260918 as u
          from backend.services import product_cards_v3 as pcv3

          src = u.load_manifest()
          rows = src['rows']
          assert len(rows) == 12
          assert [x['source_row'] for x in rows] == list(range(25, 37))

          def walk_keys(value):
              if isinstance(value, dict):
                  for k, v in value.items():
                      yield k
                      yield from walk_keys(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from walk_keys(v)

          for row in rows:
              content = u.build_content(row)
              assert set(content) == set(u.MANAGED_FIELDS)
              assert content['title']
              assert content['short_description']
              assert content['description']
              assert content['benefits']
              assert content['how_it_works']
              assert content['application']
              assert content['composition']
              assert content['characteristics']
              assert content['seo']['title']
              assert content['seo']['description']
              assert not (set(walk_keys(content)) & pcv3.FORBIDDEN_KEYS)

              card = pcv3.empty_card('OLD TITLE', f"test-{row['source_row']}")
              card['content']['brand'] = 'KEEP-BRAND'
              card['content']['category'] = 'KEEP-CATEGORY'
              before = deepcopy(card)
              after = u.apply_content(card, row)
              pcv3.validate(after)

              assert after['product_id'] == before['product_id']
              assert after['slug'] == before['slug']
              assert after['enabled'] == before['enabled']
              assert after['sku_media'] == before['sku_media']
              assert after['content']['brand'] == 'KEEP-BRAND'
              assert after['content']['category'] == 'KEEP-CATEGORY'

          print('STAGE22C BATCH03 CONTENT CONTRACT: PASS')
          PY
