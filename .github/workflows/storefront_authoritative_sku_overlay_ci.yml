name: Storefront authoritative SKU overlay CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/catalog_cms.py'
      - 'js/data-source.js'
      - 'catalog.html'
      - '.github/workflows/storefront_authoritative_sku_overlay_ci.yml'
  pull_request:
    paths:
      - 'backend/services/catalog_cms.py'
      - 'js/data-source.js'
      - 'catalog.html'
      - '.github/workflows/storefront_authoritative_sku_overlay_ci.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          python -m py_compile backend/services/catalog_cms.py
          node --check js/data-source.js

      - name: Validate authoritative V5 identity contract
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('js/data-source.js').read_text(encoding='utf-8')
          html=Path('catalog.html').read_text(encoding='utf-8')

          assert "window.BB610_STOREFRONT_V5=true" in js
          assert "products:[]" in js and "skus:[]" in js and "variants:[]" in js
          assert "const mappedSkus=(md.products||[])" in js
          assert "const mappedProducts=(md.products||[])" in js
          assert "this.catalog().products=mappedProducts" in js
          assert "this.catalog().skus=mappedSkus.filter" in js
          assert "this.catalog().variants=[]" in js
          assert "/api/v1/catalog/v5" in js
          assert "_applyV5(md)" in js
          assert "_applyLegacyContent" not in js
          assert "_applyMaster" not in js
          assert "/api/v1/catalog/master" not in js
          assert "js/data-source.js?v=" in html
          print('AUTHORITATIVE V5 SKU IDENTITY: PASS')
          PY
