name: TEMP Merchant Live Diag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_merchant_live_diag.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect original MAX 600 20kg image candidates
        shell: bash
        run: |
          set -euo pipefail
          for U in \
            'https://organicplanet.com.ua/image/catalog/products/3448.jpg' \
            'https://organicplanet.com.ua/image/catalog/products/3448.png' \
            'https://organicplanet.com.ua/image/cache/catalog/products/3448-500x500.jpg' \
            'https://organicplanet.com.ua/image/cache/catalog/products/3448-800x800.jpg'; do
            echo "URL=$U"
            if curl -LfsS --max-time 20 -A 'Mozilla/5.0' "$U" -o /tmp/img; then
              file /tmp/img
              wc -c /tmp/img
            else
              echo FAIL
            fi
          done
