name: TEMP Merchant Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_merchant_verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Merchant feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://api.market.bb610.com.ua/api/v1/catalog/feeds/google-merchant.csv -o /tmp/google.csv
          python - <<'PY'
          import csv, io, statistics
          raw=open('/tmp/google.csv',encoding='utf-8-sig').read()
          rows=list(csv.DictReader(io.StringIO(raw)))
          lens=[len((r.get('description') or '').strip()) for r in rows]
          print('ROWS',len(rows))
          print('DESC_MIN',min(lens) if lens else None)
          print('DESC_MEDIAN',statistics.median(lens) if lens else None)
          print('DESC_LT50',sum(n<50 for n in lens))
          print('DESC_LT100',sum(n<100 for n in lens))
          print('DESC_LT150',sum(n<150 for n in lens))
          for r in rows:
              if r.get('id')=='BB610-906E45D6FF4693':
                  print('MAX600_20KG_IMAGE',r.get('image_link'))
                  print('MAX600_20KG_DESC_LEN',len((r.get('description') or '').strip()))
                  print('MAX600_20KG_DESC',r.get('description'))
          PY
          curl -LfsS --max-time 30 -A 'Mozilla/5.0' 'https://organicplanet.com.ua/image/catalog/products/3448.jpg' -o /tmp/max600.jpg
          file /tmp/max600.jpg
