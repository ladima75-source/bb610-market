name: TEMP Sales Feed Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp_sales_feed_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit live feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://api.market.bb610.com.ua/api/v1/catalog/feeds/feed-status.json -o /tmp/feed-status.json
          curl -fsS --max-time 30 https://api.market.bb610.com.ua/api/v1/catalog/feeds/google-merchant.csv -o /tmp/google.csv
          python - <<'PY'
          import csv, io, json
          data = json.load(open('/tmp/feed-status.json', encoding='utf-8'))
          raw = open('/tmp/google.csv', encoding='utf-8-sig').read()
          rows = list(csv.DictReader(io.StringIO(raw)))
          items = data.get('items') or []
          blocked = [x for x in items if x.get('state') == 'blocked']
          reasons = {}
          for row in blocked:
              for code in row.get('reason_codes') or []:
                  reasons[code] = reasons.get(code, 0) + 1
          print('SOURCE=', data.get('source'))
          print('CATALOG_SKUS=', data.get('catalog_sku_count'))
          print('ELIGIBLE=', data.get('eligible_count'))
          print('CSV_ROWS=', len(rows))
          print('BLOCKED=', len(blocked))
          print('TOP_REASONS=', json.dumps(dict(sorted(reasons.items(), key=lambda kv: (-kv[1], kv[0]))), ensure_ascii=False))
          print('SAMPLE_IDS=', [r.get('id') for r in rows[:10]])
          print('CUSTOM_LABEL_VALUES=', sorted({r.get('custom_label_0') or '' for r in rows}))
          PY
