name: TwoFamily VPS Bridge

on:
  push:
    branches: [main]
    paths:
      - 'ops/twofamily-vps-command.json'
      - '.github/workflows/twofamily_vps_bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twofamily-vps-bridge
  cancel-in-progress: false

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path("ops/twofamily-vps-command.json").read_text(encoding="utf-8"))
          action=str(d.get("action") or "").strip()
          allowed={"audit","authorize-ephemeral","revoke-ephemeral","authorize-local","revoke-local","enable-deploy-user","ssh-diag","fix-deploy-login","prepare-upload","install-bundle"}
          if action not in allowed:
              raise SystemExit(f"unsupported action: {action}")
          sha=str(d.get("sha") or "").strip()
          if action in {"prepare-upload","install-bundle"}:
              import re
              if not re.fullmatch(r"[0-9a-f]{64}", sha):
                  raise SystemExit("rollout action requires sha256")
          elif sha:
              raise SystemExit("sha only valid for rollout actions")
          print(f"action={action}")
          print(f"sha={sha}")
          PY
      - name: Configure SSH
        shell: bash
        env:
          KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY"; test -n "$HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Execute TwoFamily operation
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
          ACTION: ${{ steps.req.outputs.action }}
          SHA: ${{ steps.req.outputs.sha }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            audit) remote="twofamily-audit" ;;
            authorize-ephemeral) remote="twofamily-authorize-ephemeral" ;;
            revoke-ephemeral) remote="twofamily-revoke-ephemeral" ;;
            authorize-local) remote="twofamily-authorize-local" ;;
            revoke-local) remote="twofamily-revoke-local" ;;
            enable-deploy-user) remote="twofamily-enable-deploy-user" ;;
            ssh-diag) remote="twofamily-ssh-diag" ;;
            fix-deploy-login) remote="twofamily-fix-deploy-login" ;;
            prepare-upload) remote="twofamily-rollout prepare-upload $SHA" ;;
            install-bundle) remote="twofamily-rollout install $SHA" ;;
          esac
          ssh -i ~/.ssh/vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@"$HOST" "$remote"
