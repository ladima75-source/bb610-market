name: Visible Product Card v3 structural repair CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/tools_repair_visible_pcv3_structural_20260918.py'
      - 'backend/services/product_cards_v3.py'
      - 'backend/product_cards_v3_api.py'
      - 'backend/tools_audit_visible_pcv3_storefront_20260918.py'
      - 'backend/app.py'
      - '.github/workflows/visible_pcv3_structural_repair_ci.yml'
  pull_request:
    paths:
      - 'backend/tools_repair_visible_pcv3_structural_20260918.py'
      - 'backend/services/product_cards_v3.py'
      - 'backend/product_cards_v3_api.py'
      - 'backend/tools_audit_visible_pcv3_storefront_20260918.py'
      - 'backend/app.py'
      - '.github/workflows/visible_pcv3_structural_repair_ci.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax
        run: |
          python -m py_compile backend/tools_repair_visible_pcv3_structural_20260918.py
          python -m py_compile backend/services/product_cards_v3.py
          python -m py_compile backend/product_cards_v3_api.py
          python -m py_compile backend/tools_audit_visible_pcv3_storefront_20260918.py
          python -m py_compile backend/app.py

      - name: Validate structural repair safety contract
        run: |
          python - <<'PY'
          from backend import tools_repair_visible_pcv3_structural_20260918 as t
          from pathlib import Path

          card={
            'content':{'brand':'Valagro','category':'Живлення','title':'Master 13-40-13'},
            'slug':'master-13-40-13',
            'sku_media':{
              'skus':[
                {'sku_id':'sku_a','label':'1 кг','package':'1 кг','enabled':True},
                {'sku_id':'sku_b','label':'250 г','package':'250 г','enabled':True},
              ],
              'media':[],
            }
          }
          rp={'id':'master-13-40-13'}
          rs=[
            {'id':'BB610-A-1KG','product_id':'master-13-40-13','variant':'1 кг'},
            {'id':'BB610-A-250G','product_id':'master-13-40-13','variant':'250 г'},
          ]
          matches,problems=t.exact_package_matches(card,rp,rs)
          assert not problems, problems
          assert matches['sku_a']['id']=='BB610-A-1KG'
          assert matches['sku_b']['id']=='BB610-A-250G'

          duplicate_rs=[
            {'id':'OLD-1KG','product_id':'master-13-40-13','variant':'1 кг'},
            {'id':'LIVE-1KG','product_id':'master-13-40-13','variant':'1 кг'},
            {'id':'OLD-250G','product_id':'master-13-40-13','variant':'250 г'},
            {'id':'LIVE-250G','product_id':'master-13-40-13','variant':'250 г'},
          ]
          live={'LIVE-1KG':{'enabled':True},'LIVE-250G':{'enabled':False}}
          matches,problems=t.exact_package_matches(card,rp,duplicate_rs,live=live,mapping=None)
          assert not problems, problems
          assert matches['sku_a']['id']=='LIVE-1KG'
          assert matches['sku_b']['id']=='LIVE-250G'

          card_with_code={
            **card,
            'sku_media':{
              'skus':[
                {'sku_id':'sku_a','sku_code':'OLD-1KG','label':'1 кг','package':'1 кг','enabled':True},
              ],
              'media':[],
            },
          }
          matches,problems=t.exact_package_matches(
            card_with_code,rp,duplicate_rs,live={'LIVE-1KG':{'enabled':True}},mapping=None
          )
          assert not problems, problems
          assert matches['sku_a']['id']=='OLD-1KG'

          mapping_pref={
            'skus':[{'sku_id':'sku_a','existing_commerce_sku_key':'LIVE-1KG'}]
          }
          matches,problems=t.exact_package_matches(
            card_with_code,rp,duplicate_rs,live=live,mapping=mapping_pref
          )
          assert not problems, problems
          assert matches['sku_a']['id']=='LIVE-1KG'

          authoritative=t.merge_catalog_sources(
            {
              'products':[{'id':'master-13-40-13','slug':'master-13-40-13','name':'Old title'}],
              'skus':[{'id':'BB610-A-1KG','product_id':'master-13-40-13','variant':'1 кг'}],
            },
            {
              'master-13-40-13':{'name':'Master 13-40-13','slug':'master-13-40-13','cms_published':True},
              'dynamic-product':{'name':'Dynamic product','slug':'dynamic-product','cms_published':True},
            },
            [
              {'id':'BB610-A-250G','product_id':'master-13-40-13','variant':'250 г'},
            ],
          )
          ap={x['id']:x for x in authoritative['products']}
          asku={x['id']:x for x in authoritative['skus']}
          assert ap['master-13-40-13']['name']=='Master 13-40-13'
          assert 'cms_published' not in ap['master-13-40-13']
          assert ap['dynamic-product']['id']=='dynamic-product'
          assert set(asku)=={'BB610-A-1KG','BB610-A-250G'}

          protection={
            'content':{'brand':'Syngenta','category':'Захист рослин'},
            'slug':'switch-62-5-wg'
          }
          plantlogic={
            'content':{'brand':'Plantlogic','category':'Контейнери'},
            'slug':'plantlogic-25l'
          }
          assert t.card_exclusion(protection,None,{})=='protection'
          assert t.card_exclusion(plantlogic,None,{})=='plantlogic'

          mapped_plantlogic={'existing_product_key':'plantlogic-25l'}
          runtime_plantlogic={
            'plantlogic-25l':{
              'id':'plantlogic-25l',
              'slug':'plantlogic-25l',
              'brand':'PlantLogic',
              'category_id':'containers',
              'name':'25 L container',
            }
          }
          generic_card={
            'content':{'brand':'Other','category':'Контейнери','title':'25 L container'},
            'slug':'other-container'
          }
          assert t.card_exclusion(generic_card,mapped_plantlogic,runtime_plantlogic)=='plantlogic'

          stale_mapping={'existing_product_key':'wrong-product'}
          wrong_runtime={'wrong-product':{'id':'wrong-product','slug':'wrong-product','name':'Other product'}}
          rp,res=t.exact_runtime_product(card,stale_mapping,wrong_runtime,{})
          assert rp is None
          assert res=='existing_mapping_identity_unproven'

          missing_parent={'existing_product_key':'deleted-master-parent'}
          replacement={'master-new':{'id':'master-new','slug':'master-13-40-13','name':'Master 13-40-13'}}
          rp,res=t.exact_runtime_product(
            card,missing_parent,replacement,{'master-13-40-13':replacement['master-new']}
          )
          assert rp['id']=='master-new'
          assert res=='stale_mapping_parent_exact_slug_or_id'

          sku_mapping={
            'existing_product_key':'deleted-master-parent',
            'skus':[
              {'sku_id':'sku_a','existing_commerce_sku_key':'BB610-A-1KG'},
              {'sku_id':'sku_b','existing_commerce_sku_key':'BB610-A-250G'},
            ],
          }
          sku_parent={'canonical-master':{'id':'canonical-master','slug':'other-slug','name':'Canonical Master'}}
          sku_by_key={
            'BB610-A-1KG':{'id':'BB610-A-1KG','product_id':'canonical-master','variant':'1 кг'},
            'BB610-A-250G':{'id':'BB610-A-250G','product_id':'canonical-master','variant':'250 г'},
          }
          rp,res=t.exact_runtime_product(card,sku_mapping,sku_parent,{},sku_by_key=sku_by_key)
          assert rp['id']=='canonical-master'
          assert res=='stale_mapping_parent_exact_sku_identity'

          conflicting_sku_by_key={
            'BB610-A-1KG':{'id':'BB610-A-1KG','product_id':'canonical-master','variant':'1 кг'},
            'BB610-A-250G':{'id':'BB610-A-250G','product_id':'another-parent','variant':'250 г'},
          }
          conflict_parents={
            'canonical-master':{'id':'canonical-master'},
            'another-parent':{'id':'another-parent'},
          }
          rp,res=t.exact_runtime_product(
            card,sku_mapping,conflict_parents,{},sku_by_key=conflicting_sku_by_key
          )
          assert rp is None
          assert res=='existing_mapping_sku_parent_conflict'

          title_replacement={'master-new':{'id':'master-new','slug':'different-slug','name':'Master 13-40-13'}}
          rp,res=t.exact_runtime_product(card,missing_parent,title_replacement,{})
          assert rp['id']=='master-new'
          assert res=='stale_mapping_parent_exact_title'

          valid_runtime={
            'master-13-40-13':{
              'id':'master-13-40-13',
              'slug':'master-13-40-13',
              'name':'Master 13-40-13'
            }
          }
          valid_mapping={'existing_product_key':'master-13-40-13'}
          rp,res=t.exact_runtime_product(card,valid_mapping,valid_runtime,{'master-13-40-13':valid_runtime['master-13-40-13']})
          assert rp['id']=='master-13-40-13'
          assert res=='existing_mapping_parent_exact'

          existing_mapping={
            'product_id':'prd_test',
            'existing_product_key':'master-13-40-13',
            'note':'preserve-me',
            'skus':[
              {'sku_id':'sku_a','existing_commerce_sku_key':'OLD','meta':'keep-me'},
              {'sku_id':'sku_disabled','existing_commerce_sku_key':'KEEP'},
            ],
          }
          merged=t.merge_mapping_links(existing_mapping,[
            {'sku_id':'sku_a','existing_commerce_sku_key':'BB610-A-1KG'},
            {'sku_id':'sku_b','existing_commerce_sku_key':'BB610-A-250G'},
          ])
          assert merged[0]['existing_commerce_sku_key']=='BB610-A-1KG'
          assert merged[0]['meta']=='keep-me'
          assert merged[1]=={'sku_id':'sku_disabled','existing_commerce_sku_key':'KEEP'}
          assert merged[2]=={'sku_id':'sku_b','existing_commerce_sku_key':'BB610-A-250G'}

          duplicates=t.mapping_link_rows({
            'skus':[
              {'sku_id':'sku_a','existing_commerce_sku_key':'A'},
              {'sku_id':'sku_a','existing_commerce_sku_key':'B'},
            ]
          })
          assert len(duplicates['sku_a'])==2

          legacy_card={
            'schema_version':'3.0',
            'product_id':'prd_legacy123',
            'slug':'legacy-card',
            'enabled':True,
            'content':{
              'title':'Legacy product',
              'brand':'Valagro',
              'category':'Живлення',
              'short_description':'Це достатньо довгий існуючий короткий опис картки для SEO без вигадування нового тексту.',
              'description':'Існуючий докладний опис продукту, який уже збережений у картці та може бути повторно використаний для SEO.',
              'benefits':[],
              'how_it_works':'Існуючий опис механізму дії продукту.',
              'application':'Існуючий опис способу застосування продукту.',
              'composition':'Існуючий склад продукту.',
              'characteristics':[],
              'seo':{'title':'','description':''},
            },
            'sku_media':{
              'skus':[{
                'sku_id':'sku_legacy123',
                'sku_code':'LEGACY-SKU',
                'label':'1 кг',
                'package':'1 кг',
                'primary_media_id':'med_legacy',
                'gallery_media_ids':[],
                'sort_order':0,
                'enabled':True,
              }],
              'media':[{
                'media_id':'med_legacy',
                'path':'assets/img/real/stage16b/master-13-40-13.png',
                'alt':'Legacy product',
                'kind':'product',
                'sort_order':0,
              }],
            },
          }
          legacy_mapping={
            'product_id':'prd_legacy123',
            'existing_product_key':'deleted-parent',
            'skus':[{
              'sku_id':'sku_legacy123',
              'existing_commerce_sku_key':'LEGACY-SKU',
            }],
          }
          # Stub media resolution here: this unit test validates contract logic,
          # not repository asset presence.
          old_resolvable=t._is_resolvable
          t._is_resolvable=lambda p: bool(p)
          try:
            ok,problems=t.legacy_mapping_runtime_safe(
              legacy_card,legacy_mapping,{'LEGACY-SKU':{'enabled':True}}
            )
            assert ok, problems
            broken={**legacy_card,'sku_media':{
              **legacy_card['sku_media'],
              'skus':[{**legacy_card['sku_media']['skus'][0],'primary_media_id':None}],
            }}
            ok,problems=t.legacy_mapping_runtime_safe(
              broken,legacy_mapping,{'LEGACY-SKU':{'enabled':True}}
            )
            assert not ok
            assert any('primary_media_missing' in x for x in problems)
          finally:
            t._is_resolvable=old_resolvable

          seo_patched,seo_changes=t.patch_seo_from_existing_content(legacy_card)
          assert seo_patched['content']['seo']['title']=='Legacy product'
          assert seo_patched['content']['seo']['description']==legacy_card['content']['short_description']
          assert 'seo:title_from_existing_title' in seo_changes
          assert 'seo:description_from_existing_content' in seo_changes

          src=Path('backend/tools_repair_visible_pcv3_structural_20260918.py').read_text(encoding='utf-8')
          assert 'UPDATE sku_commerce' not in src
          assert 'INSERT INTO sku_commerce' not in src
          assert 'commerce_snapshot()' in src
          assert 'repair not idempotent' in src
          assert 'load_authoritative_catalog()' in src
          assert 'load_runtime()' not in src
          assert 'RUNTIME = ROOT' not in src

          svc=Path('backend/services/product_cards_v3.py').read_text(encoding='utf-8')
          assert "'mapped': True" in svc
          assert "live_commerce_map" in svc
          assert "merged_skus" in svc

          api=Path('backend/product_cards_v3_api.py').read_text(encoding='utf-8')
          assert "/api/v1/storefront/product-card-v3/{slug}" in api
          assert "storefront_runtime" in api

          app=Path('backend/app.py').read_text(encoding='utf-8')
          assert "from .product_cards_v3_api import router as product_cards_v3_router" in app
          assert "app.include_router(product_cards_v3_router)" in app

          storefront_audit=Path('backend/tools_audit_visible_pcv3_storefront_20260918.py').read_text(encoding='utf-8')
          assert "urlopen" in storefront_audit
          assert "/api/v1/storefront/product-card-v3/" in storefront_audit
          assert "commerce_bound" in storefront_audit
          assert "primary_media_missing" in storefront_audit
          assert "UPDATE sku_commerce" not in storefront_audit
          assert "INSERT INTO sku_commerce" not in storefront_audit
          assert "pcv3.put(" not in storefront_audit

          print('VISIBLE PCV3 STRUCTURAL REPAIR CONTRACT: PASS')
          PY
