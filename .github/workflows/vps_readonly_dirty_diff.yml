name: BB610 VPS Readonly Dirty Diff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps_readonly_dirty_diff.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/bb610_vps
          chmod 600 ~/.ssh/bb610_vps
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read only dirty diff
        shell: bash
        env:
          HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bb610_vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@"$HOST" "git -C /opt/bb610-market diff -- admin/dashboard.html admin/dashboard.js backend/services/admin_dashboard.py"
