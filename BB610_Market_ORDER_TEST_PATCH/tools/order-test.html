<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>BB610 Order Test</title>
<style>body{margin:0;background:#0b0d0e;color:#f4f4f1;font:16px system-ui,Segoe UI,sans-serif}.wrap{max-width:760px;margin:8vh auto;padding:28px}.card{border:1px solid #333;background:#151819;padding:26px;border-radius:14px}h1{margin-top:0}.muted{color:#a7adaf}.warn{color:#f0b24c}.btn{border:0;background:#f0b24c;color:#111;font-weight:800;padding:14px 18px;border-radius:8px;cursor:pointer;margin:8px 8px 0 0}.ghost{background:#2a2e30;color:#fff}code{background:#222;padding:2px 5px;border-radius:4px}</style>
</head><body><div class="wrap"><div class="card"><div class="warn">INTERNAL · NOINDEX</div><h1>BB610 checkout test</h1>
<p>Службова сторінка для наскрізної перевірки: сайт → Render API → order.created → Telegram + Gmail.</p>
<p class="muted">Використовується прихований SKU <code>BB610-TEST-ORDER-001</code>, ціна 100 грн. Він не показується в каталозі та не потрапляє у sitemap/feeds.</p>
<button class="btn" id="start">СТВОРИТИ ТЕСТОВИЙ КОШИК І ВІДКРИТИ CHECKOUT</button><button class="btn ghost" id="clear">ОЧИСТИТИ ТЕСТОВИЙ КОШИК</button>
<p id="msg" class="muted"></p></div></div>
<script>
const KEY='bb610_market_cart_v2', SKU='BB610-TEST-ORDER-001';
document.getElementById('start').onclick=()=>{localStorage.setItem(KEY,JSON.stringify([{sku:SKU,qty:1}]));location.href='../checkout.html'};
document.getElementById('clear').onclick=()=>{const a=JSON.parse(localStorage.getItem(KEY)||'[]').filter(x=>x.sku!==SKU);localStorage.setItem(KEY,JSON.stringify(a));document.getElementById('msg').textContent='Тестовий SKU видалено з кошика.'};
</script></body></html>
