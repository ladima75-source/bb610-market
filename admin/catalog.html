<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BB610 Market — Картки товарів</title><link rel="stylesheet" href="catalog.css"></head><body>
<header class="top"><div class="brand">BB610 <span>MARKET ADMIN</span></div><nav class="nav"><a href="orders.html">Замовлення</a><a href="products.html">Ціни</a><a class="active" href="catalog.html">Картки товарів</a></nav></header>
<main class="shell"><div class="titlebar"><div><h1>Картки товарів</h1><div class="muted">Створення і повне редагування товарів без GitHub.</div></div><div class="controls"><input id="token" type="password" placeholder="BB610_ADMIN_TOKEN"><button id="connect">Підключити</button><button id="add">+ Додати товар</button></div></div>
<div class="controls" style="margin-bottom:18px"><input id="search" style="min-width:320px" placeholder="Пошук: товар, бренд, ID"><select id="filter"><option value="">Усі</option><option value="published">Опубліковані</option><option value="draft">Чернетки</option></select><span id="state" class="muted"></span></div><section id="cards" class="grid"></section></main>
<dialog id="editor" class="dialog"><div class="dlghead"><div><b id="editor-title">Товар</b><div class="muted" id="editor-sub"></div></div><button class="secondary" id="close">Закрити</button></div><div class="dlgbody"><div class="formgrid">
<div class="field"><label>ID товару</label><input id="f-id" placeholder="megafol"></div><div class="field"><label>Slug</label><input id="f-slug"></div>
<div class="field full"><label>Назва</label><input id="f-name"></div><div class="field"><label>Бренд</label><input id="f-brand"></div><div class="field"><label>Категорія</label><select id="f-category"><option value="nutrition">Живлення</option><option value="biostimulation">Біостимуляція</option><option value="protection">Захист рослин</option><option value="containers">Контейнери</option></select></div>
<div class="field"><label>Виробник</label><input id="f-manufacturer"></div><div class="field"><label>Країна</label><input id="f-country"></div><div class="field"><label>Тип продукту</label><input id="f-type"></div><div class="field"><label>Форма</label><input id="f-form"></div><div class="field"><label>NPK</label><input id="f-npk"></div><div class="field"><label>Діюча речовина</label><input id="f-active"></div>
<div class="field full"><label>Короткий опис</label><textarea id="f-short"></textarea></div><div class="field full"><label>Виробник рекомендує / призначення</label><textarea id="f-use"></textarea></div><div class="field full"><label>Застосування</label><textarea id="f-application"></textarea></div><div class="field full"><label>Норма</label><textarea id="f-rate"></textarea></div><div class="field full"><label>Обмеження</label><textarea id="f-restrictions"></textarea></div>
<div class="field"><label>Культури — по одному в рядку</label><textarea id="f-cultures"></textarea></div><div class="field"><label>Призначення — по одному в рядку</label><textarea id="f-purposes"></textarea></div><div class="field"><label>Склад — по одному в рядку</label><textarea id="f-composition"></textarea></div><div class="field"><label>Заводські фасовки — по одному в рядку</label><textarea id="f-packs"></textarea></div>
<div class="field full"><label>Основне фото</label><div class="row"><img id="preview" class="photo-preview" alt=""><div><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><div class="muted" style="margin-top:8px">JPG / PNG / WEBP, до 8 МБ</div><input id="f-image" style="margin-top:10px;min-width:420px" placeholder="URL фото"></div></div></div><div class="field full"><label>Додаткові фото</label><input id="gallery-upload" type="file" multiple accept="image/png,image/jpeg,image/webp"><div id="gallery-preview" class="row" style="margin-top:10px"></div></div>
<div class="field"><label>Джерело / назва</label><input id="f-source-title"></div><div class="field"><label>Джерело / URL</label><input id="f-source-url"></div><div class="field"><label><input type="checkbox" id="f-verified"> BB610 VERIFIED</label></div><div class="field"><label><input type="checkbox" id="f-published"> Опублікувати товар</label></div>
<div class="field full"><label>SKU / фасовки</label><div id="sku-list"></div><div class="sku-box"><div class="sku-title">Додати фасовку / SKU</div><div class="row" style="margin-top:10px"><input id="sku-code" placeholder="BB610-...-100ML"><input id="sku-variant" placeholder="100 мл"><input id="sku-price" type="number" step="0.01" placeholder="Ціна"><select id="sku-av"><option value="unknown">Невідомо</option><option value="in_stock">В наявності</option><option value="out_of_stock">Немає</option><option value="preorder">Передзамовлення</option></select><label><input type="checkbox" id="sku-enabled"> Продаж</label><button id="add-sku" type="button">Додати SKU</button></div></div></div>
</div></div><div class="footer"><span id="save-state" class="status"></span><div class="row"><button class="secondary" id="save-draft">Зберегти як чернетку</button><button id="save">Зберегти</button></div></div></dialog>
<script src="../config/admin-config.js"></script><script src="catalog.js"></script></body></html>
