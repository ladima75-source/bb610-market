<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Медіатека · BB610 Market Admin</title><link rel="stylesheet" href="media-manager.css?v=18f"><link rel="stylesheet" href="admin-shell.css?v=18i1">\n<link rel="stylesheet" href="admin-sticky-tables.css?v=18k1">\n</head><body>
<header><a class="brand" href="dashboard.html"><span>BB610</span> MARKET ADMIN</a><nav><a href="sales-channels.html">Канали</a><a href="orders-center.html">Замовлення</a><a href="dashboard.html">Огляд</a><a href="catalog-workbench.html">Каталог</a><a href="categories-manager.html">Категорії</a><a href="homepage-showcase.html">Головна / Вітрина</a><a class="on" href="media-manager.html">Медіатека</a><a href="catalog-import.html">Імпорт</a><a href="integrations.html">Інтеграції</a></nav><div class="auth"><input id="token" type="password" placeholder="Admin token"><button id="connect">Підключити</button></div></header>
<main><div class="head"><div><h1>Медіатека</h1><p>Локальні зображення магазину, зв’язки та безпечне видалення.</p></div><button id="uploadBtn" class="primary">＋ Завантажити</button></div>
<section class="stats"><span class="badge" id="total">0 файлів</span><span class="badge ok" id="used">0 використовуються</span><span class="badge muted" id="unused">0 не використовуються</span></section>
<section class="toolbar"><input id="search" placeholder="Пошук за назвою або шляхом"><select id="kind"><option value="">Усі типи</option><option value="product">Товар</option><option value="category">Категорія</option><option value="banner">Банер</option><option value="other">Інше</option></select><select id="usage"><option value="">Усі</option><option value="used">Використовуються</option><option value="unused">Не використовуються</option></select></section>
<div id="grid" class="grid"><div class="empty">Завантаження…</div></div></main>
<dialog id="uploadDialog"><form method="dialog"><h2>Завантажити файл</h2><input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.avif,.svg"><select id="uploadKind"><option value="product">Товар</option><option value="category">Категорія</option><option value="banner">Банер</option><option value="other">Інше</option></select><input id="uploadTitle" placeholder="Назва"><textarea id="uploadDesc" placeholder="Опис"></textarea><div><button value="cancel">Скасувати</button><button type="button" id="doUpload" class="primary">Завантажити</button></div></form></dialog>
<script src="media-manager.js?v=18f"></script><script src="admin-shell.js?v=18i"></script>\n<script src="audit-log-nav.js?v=18k"></script>\n<script src="backup-nav.js?v=18l"></script>\n</body></html>
