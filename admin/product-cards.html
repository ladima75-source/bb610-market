<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Картки товарів — BB610 Market Admin</title>
  <link rel="stylesheet" href="admin-shell.css?v=20f1">
  <link rel="stylesheet" href="admin-master-nav.css?v=19b9">
  <link rel="stylesheet" href="product-card-v3.css?v=pcv3-03">
</head>
<body>
  <main class="pcv3-page">
    <header class="pcv3-top">
      <div>
        <div class="pcv3-kicker">BB610 MARKET · КАРТКИ ТОВАРІВ</div>
        <h1>Картки товарів</h1>
        <p>Контент, SKU та фото. Ціни, залишки, наявність і публікація керуються окремо.</p>
      </div>
      <div class="pcv3-auth">
        <input id="token" type="password" placeholder="Admin token">
        <button id="connect">Підключити</button>
      </div>
    </header>

    <div id="status" class="pcv3-status">Не підключено.</div>

    <section class="pcv3-toolbar">
      <input id="search" placeholder="Пошук: назва, бренд, slug…">
      <button id="refresh">Оновити</button>
      <button id="new" class="primary">+ Додати товар</button>
    </section>

    <div class="pcv3-layout">
      <aside class="pcv3-list" id="list"><div class="muted">Підключіться до API.</div></aside>
      <section class="pcv3-editor" id="editor"><div class="empty">Оберіть картку або створіть нову.</div></section>
    </div>
  </main>

  <div id="mediaModal" class="pcv3-modal" hidden>
    <div class="pcv3-modal-card">
      <div class="pcv3-modal-head"><strong>Медіатека</strong><button id="mediaClose">×</button></div>
      <input id="mediaSearch" placeholder="Пошук у медіатеці…">
      <div id="mediaGrid" class="pcv3-media-grid"></div>
    </div>
  </div>

  <script src="admin-shell.js?v=20f1"></script>
  <script src="admin-master-nav.js?v=19b9"></script>
  <script src="product-card-v3.js?v=pcv3-03"></script>
</body>
</html>
